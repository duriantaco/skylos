    states:
      main:
        files:
          package.json: |
            {
              "name": "web-checkout",
              "version": "2.4.0",
              "private": true,
              "type": "module",
              "dependencies": {}
            }
          src/cart.ts: |
            export type CartLine = { sku: string; quantity: number; unitPrice: number };

            export function cartTotal(lines: CartLine[]): number {
              let total = 0;
              for (const line of lines) {
                total += line.quantity * line.unitPrice;
              }
              return total;
            }

            export function formatPrice(amount: number): string {
              return "$" + amount.toFixed(2);
            }
          src/checkout.ts: |
            import { cartTotal, formatPrice, type CartLine } from "./cart";

            export function renderSummary(target: HTMLElement, lines: CartLine[]): void {
              target.textContent = formatPrice(cartTotal(lines));
            }

            function legacyCouponBanner(): string {
              return "SPRING-SALE";
            }
          src/index.ts: |
            import { renderSummary } from "./checkout";

            const target = document.getElementById("summary");
            if (target) {
              renderSummary(target, [{ sku: "mug-01", quantity: 2, unitPrice: 12.5 }]);
            }

