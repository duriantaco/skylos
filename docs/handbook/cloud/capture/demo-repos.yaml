          src/main/java/co/example/ledger/LedgerRepository.java: |
            package co.example.ledger;

            import java.sql.Connection;
            import java.sql.ResultSet;
            import java.sql.SQLException;
            import java.sql.Statement;

            public class LedgerRepository {
                private final Connection connection;

                public LedgerRepository(Connection connection) {
                    this.connection = connection;
                }

                public ResultSet entriesForAccount(String accountId) throws SQLException {
                    Statement statement = connection.createStatement();
                    return statement.executeQuery(
                        "SELECT * FROM ledger_entries WHERE account_id = '" + accountId + "'");
                }

                private int unusedRounding(int cents) {
                    return cents / 100;
                }
            }
          src/main/java/co/example/ledger/LedgerController.java: |
            package co.example.ledger;

            import java.sql.ResultSet;
            import java.sql.SQLException;
            import javax.servlet.http.HttpServletRequest;

            public class LedgerController {
                private final LedgerRepository repository;

                public LedgerController(LedgerRepository repository) {
                    this.repository = repository;
                }

                public ResultSet show(HttpServletRequest request) throws SQLException {
                    String accountId = request.getParameter("account");
                    return repository.entriesForAccount(accountId);
                }
            }

