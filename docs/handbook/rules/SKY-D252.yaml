  - path: skylos/visitors/languages/go/go.py
    symbol: '"SKY-G221": "SKY-D252"'

fix:
  explanation: >-
    Set `secure=True` and `httponly=True` on every session or login
    cookie, and add `samesite="Lax"` (or `"Strict"`) so other sites cannot
    make the browser send it. In local development over plain HTTP, turn
    `Secure` off through configuration, not in the code that ships.
  filename: app/auth.py
  code: |
    from flask import Flask, make_response, request

    from app.sessions import create_session

    app = Flask(__name__)


    @app.post("/login")
    def login():
        session_id = create_session(request.form["email"], request.form["password"])
        response = make_response({"ok": True})
        response.set_cookie(
            "sid", session_id, httponly=True, secure=True, samesite="Lax"
        )
        return response

false_alarms_and_suppression:
  misfires:
    - >-
      TypeScript, JavaScript and Go also report harmless cookies that lack
      `HttpOnly` on purpose, such as a CSRF token or a UI preference the
      page script reads.
    - >-
      TypeScript and JavaScript: safe options kept in a module-level
      constant (`const sessionCookie = { httpOnly: true, secure: true }`
      outside the handler) are not followed, so the call is reported with
      both flags "unknown".
    - >-
      Missed: in Python, a cookie with `secure` left out (Flask then sends
      it without `Secure` unless configured) and framework settings such as
      `SESSION_COOKIE_SECURE = False`. In Java, cookies that never call
      `setSecure()` at all.
  suppress:
    - check: inline
      text: >-
        Mark the reported line and say why the cookie may travel over plain
        HTTP.
      language: python
      code: |
        response.set_cookie("dev_sid", sid, secure=False)  # skylos: ignore[SKY-D252] dev only
    - check: config
      text: >-
        `[tool.skylos] ignore = ["SKY-D252"]` turns the rule off for the
        whole project.
    - check: baseline
      text: >-
        `skylos baseline .` and then `--baseline` accept the existing
        findings and report only new ones.

related: [SKY-D231, SKY-D270, SKY-D254]
