id: SKY-D407
title: Terraform lets EC2 servers use metadata without tokens (IMDSv1)
family: infrastructure
severity: HIGH
languages: [Terraform]
gate:
  full: counted
  note: >-
    Reported under security (`danger`). It counts toward `max_high` and
    `max_security`; the rule never reports CRITICAL.

what_it_is: >-
  Every EC2 server can ask a local metadata service for its temporary AWS
  credentials. SKY-D407 reports a Terraform `aws_instance` or
  `aws_launch_template` with `http_tokens = "optional"`, which keeps the old
  token-free version 1 (IMDSv1) turned on.

why_it_matters: >-
  With IMDSv1, a server-side request forgery bug (an app that fetches a URL an
  attacker chooses) is enough to read the server's AWS keys from
  `http://169.254.169.254`. IMDSv2's session token stops these one-request
  attacks; the 2019 Capital One breach used exactly this path.

flagged_example:
  language: terraform
  filename: main.tf
  expect_line: 1
  code: |
    resource "aws_instance" "web" {
      ami           = "ami-0abcdef1234567890"
      instance_type = "t3.small"

      metadata_options {
        http_endpoint = "enabled"
        http_tokens   = "optional"
      }
    }

not_flagged_example:
  language: terraform
  filename: main.tf
  code: |
    resource "aws_instance" "web" {
      ami           = "ami-0abcdef1234567890"
      instance_type = "t3.small"

      metadata_options {
        http_endpoint = "enabled"
        http_tokens   = "required"
      }
    }
  why: >-
    The same block with tokens required: only IMDSv2 is served.

how_skylos_decides:
  - >-
    Runs with `--danger` (or `-a`). Reads `.tf` and `.tf.json` files, skipping
    `.terraform`, `.git`, `node_modules`, `vendor`, `build`, `dist` and
    virtual-environment folders, and parses them as HCL without running
    Terraform or contacting AWS.
  - >-
    Resolves only literal values and `local` values of the same module. Input
    variables, data sources, attributes of other resources and module outputs
    stay unknown, and an unknown value never produces a finding.
  - >-
    Skips a resource with `count = 0` or an empty `for_each`, and needs the
    official AWS provider (`hashicorp/aws`, which an `aws_` resource uses
    unless another provider is configured).
  - >-
    Checks the single `metadata_options` block of `aws_instance` and
    `aws_launch_template`.
  - >-
    Reports `http_tokens = "optional"` while `http_endpoint` is `enabled` or
    not set. An endpoint set to `disabled` passes.
  - >-
    A missing `metadata_options` block, a `dynamic` block or an unknown value
    is not judged.
  - >-
    Reports HIGH on the `resource` line.

source_refs:
  - path: skylos/rules/config/terraform/high_risk.py
    symbol: "def _metadata("
  - path: skylos/rules/config/terraform/model.py
    symbol: "def aws_provider_status("
    note: only the official AWS provider counts.
  - path: skylos/rules/config/terraform/model.py
    symbol: "def instance_status("

fix:
  explanation: >-
    Require tokens. Most current SDKs and agents support IMDSv2; test old
    software first.
  filename: main.tf
  language: terraform
  code: |
    resource "aws_instance" "web" {
      ami           = "ami-0abcdef1234567890"
      instance_type = "t3.small"

      metadata_options {
        http_endpoint = "enabled"
        http_tokens   = "required"
      }
    }

false_alarms_and_suppression:
  misfires:
    - >-
      An instance with no `metadata_options` block is not reported, although
      many AMIs then still accept IMDSv1. Write the block.
    - >-
      Values that come from variables, modules or other resources are not
      checked, because Skylos does not run Terraform: `cidr_blocks =
      var.admin_cidrs` is not reported even when its default is `0.0.0.0/0`.
    - >-
      It judges the declaration only. It does not know what is deployed, and
      other settings (account defaults, security groups, routing) can make the
      real exposure smaller or larger.
  suppress:
    - check: {kind: inline, expect: reported}
      text: >-
        Terraform rules read no inline marker: `# skylos: ignore[SKY-D407]` on
        the resource line does not hide the finding.
    - check: config
      text: >-
        `[tool.skylos] ignore = ["SKY-D407"]` turns the rule off for the
        project.
    - check: baseline
      text: >-
        A baseline (`skylos baseline .`, then `--baseline`) accepts the
        declarations that exist today and reports new ones.

related: [SKY-D400]
