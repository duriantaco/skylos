  - path: skylos/engines/go/internal/analyzer/taint.go
    symbol: "func (a *Analyzer) isTestSupportFile"

fix:
  explanation: >-
    Keep verification on. For a server whose certificate comes from a
    private CA, point the client at that CA instead: `verify=` a CA bundle
    path in `requests`/`httpx`, `ca:` in Node, `RootCAs` in Go.
  filename: app/inventory.py
  code: |
    import requests

    INVENTORY_URL = "https://inventory.internal.example.com/api/stock"
    INTERNAL_CA = "/etc/ssl/certs/internal-ca.pem"


    def fetch_stock(sku: str) -> dict:
        response = requests.get(INVENTORY_URL, params={"sku": sku}, verify=INTERNAL_CA)
        response.raise_for_status()
        return response.json()

false_alarms_and_suppression:
  misfires:
    - >-
      Test helpers that live outside test paths, such as `scripts/smoke.py`
      or a `devtools/` package, are reported.
    - >-
      In TypeScript, `rejectUnauthorized: false` is reported in any object
      literal, including options that never reach a TLS connection.
    - >-
      Missed: `session.verify = False`, a verification flag read from
      settings, and `ssl.create_default_context()` followed by
      `check_hostname = False` and `verify_mode = ssl.CERT_NONE`. In Go, a
      flag that is not the literal `true` (`InsecureSkipVerify: cfg.Insecure`)
      is missed.
  suppress:
    - check: inline
      text: >-
        Mark a reviewed line, for example a tool that only ever talks to a
        device on the local network with a fixed self-signed certificate.
      language: python
      code: |
        r = requests.get(url, verify=False)  # skylos: ignore[SKY-D210] lab device, no CA
    - check: baseline
      text: >-
        Accept the findings you already have with `skylos baseline .`, then
        scan with `--baseline` so only new ones are listed.
    - check: config
      text: >-
        `[tool.skylos] ignore = ["SKY-D210"]` turns the rule off for the
        whole project.

related: [SKY-D216, SKY-D252, SKY-D346]
