id: SKY-Q302
title: Deep nesting
family: quality
severity: VARIES
severity_note: >-
  The catalog gives no severity. Python reports MEDIUM up to two levels
  over the limit and HIGH beyond that; TypeScript, JavaScript, Java and Go
  always report MEDIUM.
languages: [Python, TypeScript, JavaScript, Java, Go]
gate:
  full: counted
  note: >-
    Hidden when it is the only metric reported for the function. In Python
    and JS/TS it is listed when SKY-Q306 also reports the function, in Go
    and Java when another function metric does; the metrics then share one
    entry, led by the most severe, which the gate counts once. Otherwise it
    is counted only with `--all-advice` or when the rule is named in
    `[tool.skylos.gate] rules`.

what_it_is: >-
  Nesting depth is how many blocks (`if`, loops, `try`, `switch`) sit
  inside each other at the deepest point of a function. SKY-Q302 reports a
  function nested deeper than 3 levels in Python, or 4 in TS/JS, Java and
  Go.

why_it_matters: >-
  Code four or five levels deep is hard to read and easy to break: the
  reader has to hold every enclosing condition in mind, and adding a case
  often goes into the wrong block.

flagged_example:
  language: python
  filename: app/billing.py
  expect_line: 4
  code: |
    """Stripe webhook handling for seat-based plans."""


    def apply_invoice(event, seats):
        if event["type"] == "invoice.paid":
            for line in event["data"]["object"]["lines"]["data"]:
                if line["price"]["recurring"]:
                    for _ in range(line["quantity"]):
                        seats.activate(line["subscription"])
        return seats

not_flagged_example:
  language: python
  filename: app/billing.py
  code: |
    """Stripe webhook handling for seat-based plans."""

    import logging

    log = logging.getLogger(__name__)


    def apply_invoice(event, seats):
        if event["type"] != "invoice.paid":
            return seats
        try:
            for line in event["data"]["object"]["lines"]["data"]:
                if line["price"]["recurring"]:
                    for _ in range(line["quantity"]):
                        seats.activate(line["subscription"])
        except KeyError:
            log.warning("invoice event %s has no line items", event.get("id"))
        return seats
  why: >-
    The event check is now a guard clause that returns early, and a `try`
    written directly in the function body does not add a level. The
    deepest line sits 3 levels down, which is the limit, not over it.

more_examples:
  - flagged:
      language: typescript
      filename: src/cart/coupons.ts
      expect_line: 9
      code: |
        type Item = { sku: string; quantity: number; discount: number };
        type Coupon = {
          sku: string;
          amount: number;
          minQuantity: number;
          expiresAt: number;
        };

        export function applyCoupons(items: Item[], coupons: Coupon[], now: number) {
          for (const item of items) {
            for (const coupon of coupons) {
              if (coupon.sku === item.sku) {
                if (coupon.expiresAt > now) {
                  if (item.quantity >= coupon.minQuantity) {
                    item.discount = coupon.amount;
                  }
                }
              }
            }
          }
        }
    not_flagged:
      language: typescript
      filename: src/cart/coupons.ts
      code: |
        type Item = { sku: string; quantity: number; discount: number };
        type Coupon = {
          sku: string;
          amount: number;
          minQuantity: number;
          expiresAt: number;
        };

        export function applyCoupons(items: Item[], coupons: Coupon[], now: number) {
          for (const item of items) {
            for (const coupon of coupons) {
              if (coupon.sku === item.sku && coupon.expiresAt > now) {
                if (item.quantity >= coupon.minQuantity) {
                  item.discount = coupon.amount;
                }
              }
            }
          }
        }
      why: >-
        Joining two checks with `&&` leaves 4 levels. In TS/JS the limit is
        4, so this is not reported, although the same depth in Python
        would be.

how_skylos_decides:
  - >-
    Runs with `--quality`. Measures the deepest block inside each function
    or method. Nested functions, classes and lambdas are not counted here;
    each nested function is measured on its own.
  - >-
    Python adds a level for `if`, `for`, `async for`, `while` and `match`
    (an `else` body sits at the same depth as its `if` body; an `elif` adds
    nothing). `with` adds no level. A `try` written directly in the
    function body, or inside a top-level `with`, adds no level; a `try`
    deeper down adds one.
  - >-
    TypeScript and JavaScript add a level for `if` (not `else if`), every
    loop, `switch` and `try`. Java adds one for `if`, loops, `switch` and
    `try`; Go for `if`, `for`, `switch`, type switches and `select`.
  - >-
    Reports a depth above the limit. Python reads `nesting` under
    `[tool.skylos]` (default 3). TS/JS, Java and Go always use 4 and ignore
    that setting.
  - >-
    Python skips test code, `examples` and `benchmarks` folders, a top-level
    `docs` folder and the root `setup.py`, as SKY-Q301 does. Minified
    JavaScript is not scanned.
  - >-
    Reports on the function's first line. Python reports MEDIUM up to two
    levels over the limit and HIGH beyond; the other languages report
    MEDIUM.

source_refs:
  - path: skylos/rules/quality/nesting.py
    symbol: "def _max_depth("
  - path: skylos/rules/quality/nesting.py
    symbol: "class NestingRule"
  - path: skylos/visitors/languages/typescript/quality.py
    symbol: "def _max_nesting("
  - path: skylos/visitors/languages/typescript/quality.py
    symbol: "max_nesting: int = 4"
    note: scan_quality is called without it, so TS/JS always use 4.
  - path: skylos/visitors/languages/java/quality.py
    symbol: "NESTING_NODES"
  - path: skylos/visitors/languages/go/quality.py
    symbol: "NESTING_NODES"
  - path: skylos/config.py
    symbol: '"nesting": 3,'
  - path: skylos/reporting/advice_display.py
    symbol: "def standalone_function_advice("
    note: a lone nesting finding is hidden by default.
  - path: test/test_nesting.py
    symbol: "def test_severity_levels"

fix:
  explanation: >-
    Return early for the cases you do not handle, and move the inner loop
    into a helper named after what it does.
  filename: app/billing.py
  code: |
    """Stripe webhook handling for seat-based plans."""


    def _activate_line(line, seats):
        if not line["price"]["recurring"]:
            return
        for _ in range(line["quantity"]):
            seats.activate(line["subscription"])


    def apply_invoice(event, seats):
        if event["type"] != "invoice.paid":
            return seats
        for line in event["data"]["object"]["lines"]["data"]:
            _activate_line(line, seats)
        return seats

false_alarms_and_suppression:
  misfires:
    - >-
      Python and the other languages use different limits (3 and 4), and
      only the Python one can be changed, so the same code can be reported
      in one language and not in another.
    - >-
      A `with` block adds no level in Python, but a `try` inside an `if`
      does, so wrapping an existing block in `try` can tip a function over
      the limit.
  suppress:
    - check: inline
      text: >-
        On the `def` line (the reported line):
      language: python
      code: |
        def apply_invoice(event, seats):  # skylos: ignore[SKY-Q302] mirrors the payload
    - check: config
      text: >-
        `[tool.skylos] ignore = ["SKY-Q302"]` turns the rule off for the
        project; `nesting = 4` under `[tool.skylos]` raises the Python limit
        instead. A baseline accepts existing findings, but it records the
        absolute file path and the line, so an entry stops matching when the
        checkout moves or the line shifts.

related: [SKY-Q306, SKY-Q301, SKY-C304]
