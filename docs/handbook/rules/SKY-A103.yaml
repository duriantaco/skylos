    symbol: "def _scan_ai_defect_diff_signals("

fix:
  explanation: >-
    Keep the workflow's token read-only and grant `write` only to the one
    job that needs it, for the one scope it needs. If the release must push
    a tag, give that job `contents: write` and leave every other job at
    `contents: read`.
  language: yaml
  filename: .github/workflows/release.yml
  code: |
    name: release

    on:
      push:
        tags: ["v*"]

    permissions:
      contents: read

    jobs:
      publish:
        runs-on: ubuntu-latest
        steps:
          - uses: actions/checkout@v4
          - run: make release

false_alarms_and_suppression:
  misfires:
    - >-
      A deliberate grant, such as `id-token: write` for trusted publishing,
      is reported. That is intended: the finding asks a reviewer to confirm
      it.
    - >-
      Moving a job-level grant to a different job in a multi-line edit is
      reported again, because only one-line replacements are compared for
      job-level blocks.
    - >-
      Workflows outside `.github/workflows/`, such as composite actions in
      `action.yml`, are not read.
    - >-
      In a repository with no source file Skylos analyses (only workflows
      and YAML, say), the scan takes a shorter path that does not run this
      rule, so nothing is reported.
  suppress:
    - check: {kind: inline, expect: reported}
      text: >-
        An inline `# skylos: ignore[SKY-A103]` comment does not silence it
        in Skylos 5.6.0: the inline-ignore lookup does not match this rule's
        findings in workflow files.
      language: yaml
      code: |
        contents: write  # skylos: ignore[SKY-A103] release pushes the tag
    - check: config
      text: >-
        `[tool.skylos] ignore = ["SKY-A103"]` turns the rule off for the
        project.

related: [SKY-D292, SKY-D294, SKY-A121, SKY-A122]
