id: SKY-R101
title: Python type-check policy
family: quality
severity: MEDIUM
languages: [Python]
gate:
  full: counted
  diff: counted
  note: >-
    Advice that is measured on every `--quality` scan but not listed by
    default. It is listed, and counted toward `max_quality`, with
    `--all-advice` or when the rule is named in `[tool.skylos.gate] rules`.
    A diff scan checks it only when the change touches a policy file such
    as `pyproject.toml`.

what_it_is: >-
  A type checker (mypy or pyright) reads type annotations and catches
  calls with the wrong kind of value before the code runs. SKY-R101
  reports a repository that contains Python code but has no mypy or
  pyright configuration.

why_it_matters: >-
  Without a configured checker, annotations are only comments: nothing
  stops a change that passes a string where a number is expected, and
  each developer runs a different check, or none, before pushing.

flagged_example:
  language: python
  files:
    - filename: pyproject.toml
      language: toml
      code: |
        [project]
        name = "shop"
        version = "1.0.0"

        [tool.ruff]
        line-length = 88
    - filename: app/pricing.py
      code: |
        """Price helpers."""


        def total(prices: list[float]) -> float:
            return sum(prices)
  expect_file: pyproject.toml
  expect_line: 1

not_flagged_example:
  language: python
  files:
    - filename: pyproject.toml
      language: toml
      code: |
        [project]
        name = "shop"
        version = "1.0.0"

        [tool.ruff]
        line-length = 88
    - filename: pyrightconfig.json
      language: json
      code: |
        {
          "include": ["app"],
          "typeCheckingMode": "strict"
        }
    - filename: app/pricing.py
      code: |
        """Price helpers."""


        def total(prices: list[float]) -> float:
            return sum(prices)
  why: >-
    The type checker is configured in `pyrightconfig.json` instead of
    `pyproject.toml`. Skylos looks in every usual place, so the project has
    a type-check policy.

how_skylos_decides:
  - >-
    Runs with `--quality`, once per scanned project. A diff scan runs it
    only when a policy file (such as `pyproject.toml`, `setup.cfg`,
    `mypy.ini` or `pyrightconfig.json`) is among the changed files.
  - >-
    Checks that the project has at least one `.py`, `.pyi` or `.pyw` file,
    leaving out excluded folders and virtual environments.
  - >-
    Looks for a type-checker policy at the project root: `[tool.mypy]` or
    `[tool.pyright]` in `pyproject.toml`, a `mypy.ini` file, a `[mypy]`
    section in `.mypy.ini` or `setup.cfg`, or a `pyrightconfig.json` file.
  - >-
    When none exists, reports MEDIUM on line 1 of `pyproject.toml`, or on
    the project folder when there is no `pyproject.toml`.

source_refs:
  - path: skylos/rules/quality/policy.py
    symbol: "def analyze_repo_policy("
  - path: skylos/rules/quality/policy.py
    symbol: "def _has_type_checker_config("
  - path: skylos/rules/quality/policy.py
    symbol: "def _policy_files("
    note: the files that make a diff scan run the check.

fix:
  explanation: >-
    Add a mypy or pyright configuration and run it in CI. Starting with the
    folders you control is fine; `files` says which code mypy checks.
  filename: pyproject.toml
  language: toml
  code: |
    [project]
    name = "shop"
    version = "1.0.0"

    [tool.ruff]
    line-length = 88

    [tool.mypy]
    files = ["app"]
    disallow_untyped_defs = true

false_alarms_and_suppression:
  misfires:
    - >-
      A type checker configured only on the command line, in a Makefile or
      in a CI file, is not seen, so the project is reported.
    - >-
      A repository with only a few helper scripts in Python is reported
      like a Python application.
  suppress:
    - check:
        kind: inline
        expect: reported
      text: >-
        An inline marker in `pyproject.toml` does **not** work: with this
        comment on the reported line, the finding stays.
      language: toml
      code: |
        [project]  # skylos: ignore[SKY-R101] checked by pyright in CI
    - check:
        kind: example
        example:
          language: python
          files:
            - filename: pyproject.toml
              language: toml
              code: |
                [project]
                name = "shop"
                version = "1.0.0"

                [tool.ruff]
                line-length = 88

                [tool.skylos]
                ignore = ["SKY-R101"]
            - filename: app/pricing.py
              code: |
                """Price helpers."""


                def total(prices: list[float]) -> float:
                    return sum(prices)
      text: >-
        `ignore = ["SKY-R101"]` under `[tool.skylos]` turns the check off.

related: [SKY-R102, SKY-R105, SKY-T101]
