id: SKY-A119
title: Linter or scanner settings weakened
family: ai-defects
severity: HIGH
languages: [Python tool settings (Ruff, Flake8, Pylint, mypy, Pyright, Bandit), TypeScript and ESLint, Biome, golangci-lint, Cargo lints, pre-commit, scanner settings (Semgrep, SonarQube, CodeQL, gitleaks, detect-secrets, Trivy, OSV-Scanner, Snyk, Checkstyle, SpotBugs)]
gate:
  full: not_run
  note: >-
    Only `skylos done` reports it, in its `silenced_checks` check, which
    advises by default: the finding is shown but does not fail the verdict.
    With `silenced_checks = "block"` in `[tool.skylos.done.checks]` it
    blocks. `skylos cicd risk-review` always counts it as "checks
    silenced", which needs a human approval, even the test-only advice.
run_with: >-
  `skylos done` (compares uncommitted changes with `HEAD`) or
  `skylos done --base origin/main` for a pull request; agent hooks run it
  when the agent stops
verify:
  mode: manual
  reason: >-
    Only `skylos done` runs this rule; the handbook build runs `skylos .`
    scans, which never report it.

what_it_is: >-
  The change makes a linter, type checker or scanner check less instead of
  fixing what it found: it ignores a rule, excludes a source folder, turns
  `strict` off, lowers a rule's level or accepts a finding in a baseline
  file. Skylos compares each tool's settings at the base and after the
  change.

why_it_matters: >-
  One added line in a settings file silences a whole class of findings for
  every future change, not just the one that triggered it. Coding agents
  reach for it when a lint error blocks them, and reviewers rarely read
  config diffs closely.

flagged_example:
  language: python
  setup: git_diff
  expect_file: pyproject.toml
  expect_line: 7
  base_files:
    - filename: pyproject.toml
      language: toml
      code: |
        [project]
        name = "reports"
        version = "2.1.0"

        [tool.ruff.lint]
        select = ["E", "F", "S"]
    - filename: reports/queries.py
      code: |
        def monthly_sales(db, month):
            return db.execute(
                "SELECT sum(total) FROM orders WHERE month = ?", (month,)
            ).fetchone()
  files:
    - filename: reports/queries.py
      code: |
        def monthly_sales(db, month, region):
            sql = f"SELECT sum(total) FROM orders WHERE month = ? AND region = '{region}'"
            return db.execute(sql, (month,)).fetchone()
    - filename: pyproject.toml
      language: toml
      code: |
        [project]
        name = "reports"
        version = "2.1.0"

        [tool.ruff.lint]
        select = ["E", "F", "S"]
        ignore = ["S608"]

not_flagged_example:
  language: python
  setup: git_diff
  base_files:
    - filename: pyproject.toml
      language: toml
      code: |
        [project]
        name = "reports"
        version = "2.1.0"

        [tool.ruff.lint]
        select = ["E", "F", "S"]
    - filename: reports/queries.py
      code: |
        def monthly_sales(db, month):
            return db.execute(
                "SELECT sum(total) FROM orders WHERE month = ?", (month,)
            ).fetchone()
    - filename: reports/proto/orders_pb2.py
      code: |
        # Generated by the protocol buffer compiler.  DO NOT EDIT!
        from google.protobuf import descriptor_pool as _descriptor_pool

        DESCRIPTOR = _descriptor_pool.Default().AddSerializedFile(b"\n\x0corders.proto")
  files:
    - filename: pyproject.toml
      language: toml
      code: |
        [project]
        name = "reports"
        version = "2.1.0"

        [tool.ruff]
        extend-exclude = ["reports/proto"]

        [tool.ruff.lint]
        select = ["E", "F", "S"]
  why: >-
    The new exclude leaves out only generated protobuf code (`*_pb2.py`),
    which was never the project's to lint. An exclude counts only when it
    removes a source file the tool was checking; build output, vendored,
    generated and migration files do not count.

more_examples:
  - flagged:
      language: json
      setup: git_diff
      expect_file: tsconfig.json
      expect_line: 4
      base_files:
        - filename: tsconfig.json
          code: |
            {
              "compilerOptions": {
                "target": "ES2022",
                "strict": true,
                "outDir": "dist"
              },
              "include": ["src"]
            }
        - filename: src/user.ts
          language: typescript
          code: |
            export function displayName(user: { name?: string }): string {
              return user.name ?? "anonymous";
            }
      files:
        - filename: tsconfig.json
          code: |
            {
              "compilerOptions": {
                "target": "ES2022",
                "strict": false,
                "outDir": "dist"
              },
              "include": ["src"]
            }
    not_flagged:
      language: json
      setup: git_diff
      base_files:
        - filename: tsconfig.json
          code: |
            {
              "compilerOptions": {
                "target": "ES2022",
                "strict": true,
                "outDir": "dist"
              },
              "include": ["src"]
            }
        - filename: src/user.ts
          language: typescript
          code: |
            export function displayName(user: { name?: string }): string {
              return user.name ?? "anonymous";
            }
      files:
        - filename: tsconfig.json
          code: |
            {
              "compilerOptions": {
                "target": "ES2022",
                "strict": true,
                "skipLibCheck": true,
                "outDir": "dist"
              },
              "include": ["src"]
            }
      why: >-
        `skipLibCheck` stops type-checking the `.d.ts` files of installed
        packages; the project's own code is still checked as strictly as
        before. Skylos does not count it as a weakening.

how_skylos_decides:
  - >-
    Runs in `skylos done`, which compares the working tree (or a pull
    request's head) with a base commit: `HEAD` by default, the merge base
    with `--base`. Its settings come from the base commit, never from the
    change.
  - >-
    For each changed file, finds the tools that read it (for example
    `pyproject.toml` for Ruff, Flake8, Pylint, mypy, Pyright and Bandit;
    `tsconfig*.json`; ESLint configs and `package.json`; `.golangci.yml`;
    `.semgrepignore`; `.secrets.baseline`), and builds each tool's settings
    from all its files in that folder, at the base and after the change.
    Moving settings between files the tool reads together is not a change;
    settings built at run time are not read.
  - >-
    Reports newly ignored rules (for Ruff only codes a selected rule
    covers), newly excluded paths, rules removed from a selection or a
    preset dropped, levels lowered (`strict` off, a rule from `error` to
    `warn` or off), and new allowed findings such as baseline or ignore-file
    entries.
  - >-
    A new exclude or ignore pattern counts only when it matches a source
    file the tool checked; build output, vendored, generated and migration
    files never count, and one that matches only test files is advice.
    `skipLibCheck` is not a weakening. The first settings of a brand-new
    package weaken nothing.

source_refs:
  - path: skylos/done/lint_config.py
    symbol: "def detect_weakened_settings("
  - path: skylos/done/lint_config.py
    symbol: "def tools_for("
  - path: skylos/done/lint_config.py
    symbol: "def _compare("
  - path: skylos/done/lint_config.py
    symbol: "def _rule_matters("
  - path: skylos/done/lint_config.py
    symbol: "_NOT_SOURCE_SUFFIXES = ("
  - path: skylos/done/checks.py
    symbol: "def check_silenced_checks("
  - path: skylos/done/config.py
    symbol: '"silenced_checks": "advise"'
    note: the default mode.

fix:
  explanation: >-
    Keep the rule on and fix the code it found. Here, pass the region as a
    query parameter instead of formatting it into the SQL string. If one
    line really is safe, silence that line with a reason rather than the
    rule for the whole project.
  language: python
  code: |
    def monthly_sales(db, month, region):
        sql = "SELECT sum(total) FROM orders WHERE month = ? AND region = ?"
        return db.execute(sql, (month, region)).fetchone()

false_alarms_and_suppression:
  misfires:
    - >-
      A deliberate policy change, such as dropping a noisy rule the team
      agreed to stop using, is reported. That is intended: it asks a
      reviewer to confirm it.
    - >-
      A config built at run time (an ESLint config returned by a function,
      spread from another object, or read from a variable) contributes
      nothing, so weakening done there is not seen.
  suppress:
    - text: >-
        `skylos done` findings ignore `# skylos: ignore[...]` comments and the
        `[tool.skylos] ignore` list. The check only advises by default; to
        turn it off, commit the mode to the base branch first (the change
        under review cannot change its own check):
      language: toml
      code: |
        [tool.skylos.done.checks]
        silenced_checks = "off"

related: [SKY-A118, SKY-A121, SKY-A125, SKY-A112]
