id: SKY-D405
title: Terraform makes an RDS database publicly accessible
family: infrastructure
severity: HIGH
languages: [Terraform]
gate:
  full: counted
  note: >-
    Reported under security (`danger`). It counts toward `max_high` and
    `max_security`; the rule never reports CRITICAL.

what_it_is: >-
  `publicly_accessible = true` gives an Amazon RDS database a public DNS name
  and IP address. SKY-D405 reports a Terraform `aws_db_instance` that asks for
  this.

why_it_matters: >-
  A database reachable from the internet is one security-group mistake away
  from password guessing and exploit attempts against the database server.
  Application databases rarely need it: the application talks to them inside
  the VPC.

flagged_example:
  language: terraform
  filename: main.tf
  expect_line: 1
  code: |
    resource "aws_db_instance" "orders" {
      identifier                  = "orders"
      engine                      = "postgres"
      engine_version              = "16.4"
      instance_class              = "db.t3.medium"
      allocated_storage           = 50
      username                    = "orders"
      manage_master_user_password = true
      storage_encrypted           = true
      publicly_accessible         = true
    }

not_flagged_example:
  language: terraform
  filename: main.tf
  code: |
    resource "aws_db_instance" "orders" {
      identifier                  = "orders"
      engine                      = "postgres"
      engine_version              = "16.4"
      instance_class              = "db.t3.medium"
      allocated_storage           = 50
      username                    = "orders"
      manage_master_user_password = true
      storage_encrypted           = true
      publicly_accessible         = false
    }
  why: >-
    The same database with public access explicitly off. It is reachable only
    from inside its VPC.

how_skylos_decides:
  - >-
    Runs with `--danger` (or `-a`). Reads `.tf` and `.tf.json` files, skipping
    `.terraform`, `.git`, `node_modules`, `vendor`, `build`, `dist` and
    virtual-environment folders, and parses them as HCL without running
    Terraform or contacting AWS.
  - >-
    Resolves only literal values and `local` values of the same module. Input
    variables, data sources, attributes of other resources and module outputs
    stay unknown, and an unknown value never produces a finding.
  - >-
    Skips a resource with `count = 0` or an empty `for_each`, and needs the
    official AWS provider (`hashicorp/aws`, which an `aws_` resource uses
    unless another provider is configured).
  - >-
    Checks `aws_db_instance` resources.
  - >-
    Reports when `publicly_accessible` is the literal `true`. Leaving it out
    (the AWS default is `false`) is not reported.
  - >-
    Reports HIGH on the `resource` line. Whether the database can really be
    reached also depends on subnets, routes and security groups, which the
    rule does not evaluate.

source_refs:
  - path: skylos/rules/config/terraform/high_risk.py
    symbol: "def _explicit_boolean("
  - path: skylos/rules/config/terraform/high_risk.py
    symbol: "RDS_RULE: lambda p, r"
  - path: skylos/rules/config/terraform/model.py
    symbol: "def aws_provider_status("
    note: only the official AWS provider counts.
  - path: skylos/rules/config/terraform/model.py
    symbol: "def instance_status("

fix:
  explanation: >-
    Set `publicly_accessible = false` and reach the database from inside the
    VPC, through a bastion, Session Manager port forwarding or a VPN.
  filename: main.tf
  language: terraform
  code: |
    resource "aws_db_instance" "orders" {
      identifier                  = "orders"
      engine                      = "postgres"
      engine_version              = "16.4"
      instance_class              = "db.t3.medium"
      allocated_storage           = 50
      username                    = "orders"
      manage_master_user_password = true
      storage_encrypted           = true
      publicly_accessible         = false
    }

false_alarms_and_suppression:
  misfires:
    - >-
      Values that come from variables, modules or other resources are not
      checked, because Skylos does not run Terraform: `cidr_blocks =
      var.admin_cidrs` is not reported even when its default is `0.0.0.0/0`.
    - >-
      It judges the declaration only. It does not know what is deployed, and
      other settings (account defaults, security groups, routing) can make the
      real exposure smaller or larger.
  suppress:
    - check: {kind: inline, expect: reported}
      text: >-
        Terraform rules read no inline marker: `# skylos: ignore[SKY-D405]` on
        the resource line does not hide the finding.
    - check: config
      text: >-
        `[tool.skylos] ignore = ["SKY-D405"]` turns the rule off for the
        project.
    - check: baseline
      text: >-
        A baseline (`skylos baseline .`, then `--baseline`) accepts the
        declarations that exist today and reports new ones.

related: [SKY-D408, SKY-D401]
