fix:
  explanation: >-
    To run the jobs together, map them to promises and await them all. To
    run them one at a time, use `for (const id of ids) { await … }`; Skylos
    may then add one LOW SKY-Q402 finding per `await` in the loop, which is
    expected for deliberate sequential work.
  filename: src/orders/sync.ts
  code: |
    import { db } from "../db";
    import { pushToWarehouse } from "./warehouse";

    export async function syncPendingOrders(orderIds: Iterable<string>): Promise<number> {
      const ids = Array.from(orderIds);

      await Promise.all(
        ids.map(async (id) => {
          const order = await db.orders.findById(id);
          await pushToWarehouse(order);
          await db.orders.markSynced(id);
        }),
      );

      return ids.length;
    }

false_alarms_and_suppression:
  misfires:
    - >-
      A deliberate fire-and-forget, where the callback handles its own
      errors and nobody needs to wait, is still reported.
    - >-
      It misses the same bug on receivers it cannot prove are arrays, such
      as a function parameter typed `string[]` or a `Set`.
  suppress:
    - text: >-
        On the reported line, where the call starts:
      language: typescript
      code: |
        ids.forEach(async (id) => { // skylos: ignore[SKY-Q406] errors handled inside
    - text: >-
        `[tool.skylos] ignore = ["SKY-Q406"]` turns the rule off for the
        project. A baseline accepts existing findings, but it records the
        absolute file path and the line, so an entry stops matching when the
        checkout moves or the line shifts.

related: [SKY-Q407, SKY-Q405, SKY-Q402]
