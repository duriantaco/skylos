how_skylos_decides:
  - >-
    Runs with `--sca --review-upgrades` in a diff scan. Each npm and PyPI
    version that changed in a lockfile is paired with the version the base
    branch locked; a package new to the project has no old version.
  - >-
    The `ca9` library downloads the releases and compares their files as
    text and syntax trees. It never installs, imports or runs them.
  - >-
    The warning list: new network or process calls at import time, more
    obfuscated code, a new native binary, a different publisher, a changed
    install script and a changed native binary.
  - >-
    For a package new to the project there is nothing to compare with, so
    `ca9` reviews the release on its own: an install script or a nested
    start-up module is a warning here, and the strong signals that would be
    SKY-SCA-UPG001 on an upgrade (a `.pth` file with code, decode-and-run
    code, a Git dependency) are reported under this rule too, with a
    message saying there was no earlier version.
  - >-
    A change on the block list for an upgraded package is SKY-SCA-UPG001
    instead. A changed package that could not be reviewed stops the scan
    as incomplete.

source_refs:
  - path: skylos/rules/sca/supply_chain_diff.py
    symbol: "def _upgrade_finding("
    note: a warn list, or any list on a new package, is UPG002.
  - path: skylos/rules/sca/supply_chain_diff.py
    symbol: "def upgrade_findings("
  - path: skylos/core/gatekeeper.py
    symbol: "REPORT_ONLY_DEPENDENCY_RULES = frozenset("

fix:
  explanation: >-
    Read the file the message names. For `esbuild`, `install.js` downloads
    the platform binary, which is expected; for a package that has no
    reason to touch the network at install, ask why before merging. With
    pnpm or Bun, allow install scripts only for packages you have reviewed
    (`allowBuilds`, `trustedDependencies`).

false_alarms_and_suppression:
  misfires:
    - >-
      Most findings are honest changes, such as a build tool that fetches
      its binary. That is why the rule only lists them.
    - >-
      Behaviour both releases share is not reported, so a package that
      always called the network at import is not flagged again.
  suppress:
    - check: config
      text: >-
        `[tool.skylos] ignore = ["SKY-SCA-UPG002"]` turns the rule off. In
        pull-request CI the setting is read from the base branch.

related: [SKY-SCA-UPG001, SKY-SCA-API001, SKY-SCA-HRD001]
