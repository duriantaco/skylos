id: SKY-SCA-UPG002
title: Dependency upgrade adds code worth reviewing
family: supply-chain
severity: MEDIUM
languages: [package-lock.json, npm-shrinkwrap.json, pnpm-lock.yaml, yarn.lock, bun.lock, uv.lock, poetry.lock, Pipfile.lock]
gate:
  full: not_run
  diff: listed
  note: >-
    The built-in gate reports it without counting it: it asks for a look, it
    does not block. A gate policy pulled from Skylos Cloud counts it toward
    `max_dependency_vulnerabilities`. It only runs in diff scans with
    `--review-upgrades`.
run_with: >-
  `skylos . --sca --review-upgrades --diff origin/main` on a pull request; the
  workflow `skylos setup` writes turns this on

what_it_is: >-
  A pull request adds an npm or PyPI package to a lockfile, or moves one to a
  new version. SKY-SCA-UPG002 reports a new release that contains code
  worth reading before it is installed: an install script, a changed
  install script, network or process calls when the package is imported,
  more obfuscated code, a new native binary, or a different publisher.

why_it_matters: >-
  These changes are common in honest releases, so they do not block. They
  are also what a compromised release looks like, and the lockfile diff
  shows only a version number. The finding names the file to read, so the
  check takes minutes instead of a full audit.

flagged_example:
  language: json
  setup: git_diff
  expect_file: package-lock.json
  expect_line: 18
  scan_flags: ["--sca", "--review-upgrades", "--diff=HEAD"]
  base_files:
    - filename: package-lock.json
      code: |
        {
          "name": "shop",
          "version": "1.0.0",
          "lockfileVersion": 3,
          "requires": true,
          "packages": {
            "": {
              "name": "shop",
              "version": "1.0.0",
              "dependencies": {
                "ms": "2.1.3"
              }
            },
            "node_modules/ms": {
              "version": "2.1.3",
              "resolved": "https://registry.npmjs.org/ms/-/ms-2.1.3.tgz",
              "license": "MIT"
            }
          }
        }
  files:
    - filename: package-lock.json
      code: |
        {
          "name": "shop",
          "version": "1.0.0",
          "lockfileVersion": 3,
          "requires": true,
          "packages": {
            "": {
              "name": "shop",
              "version": "1.0.0",
              "dependencies": {
                "ms": "2.1.3"
              },
              "devDependencies": {
                "esbuild": "0.24.0"
              }
            },
            "node_modules/esbuild": {
              "version": "0.24.0",
              "resolved": "https://registry.npmjs.org/esbuild/-/esbuild-0.24.0.tgz",
              "dev": true,
              "hasInstallScript": true,
              "license": "MIT"
            },
            "node_modules/ms": {
              "version": "2.1.3",
              "resolved": "https://registry.npmjs.org/ms/-/ms-2.1.3.tgz",
              "license": "MIT"
            }
          }
        }

