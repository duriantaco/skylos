fix:
  explanation: >-
    Check the caller before the route runs. Put the check where it covers
    every route, such as a `before_request` hook or FastAPI app
    `dependencies=`, so a new route cannot forget it. Bind the server to
    `127.0.0.1` unless other machines really need to reach it.
  filename: app/server.py
  code: |
    import hmac
    import os
    import subprocess

    from flask import Flask, abort, jsonify, request

    app = Flask(__name__)
    API_KEY = os.environ["DEVICE_API_KEY"]


    @app.before_request
    def require_api_key():
        sent = request.headers.get("X-Api-Key", "")
        if not hmac.compare_digest(sent, API_KEY):
            abort(401)


    @app.get("/status")
    def status():
        return jsonify(ok=True)


    @app.post("/system/reboot")
    def reboot():
        subprocess.run(["systemctl", "reboot"], check=True)
        return jsonify(status="rebooting")


    if __name__ == "__main__":
        app.run(host="127.0.0.1", port=8080)

false_alarms_and_suppression:
  misfires:
    - >-
      Authentication done outside the file is not seen: a reverse proxy, an
      API gateway, or a WSGI wrapper set up in another module. Such an app
      is still reported.
    - >-
      A route whose name only sounds privileged is reported, for example
      `POST /reports/export-command` that only stores a request.
    - >-
      Missed: any authentication-like name in the handler (even an unused
      `token` variable) is taken as a possible check, and routes on an app
      created in another module are not checked.
  suppress:
    - check: inline
      text: >-
        Mark the `def` line of the route and say what protects it.
      language: python
      code: |
        def reboot():  # skylos: ignore[SKY-D283] only reachable through the VPN gateway
    - check: config
      text: >-
        `[tool.skylos] ignore = ["SKY-D283"]` turns the rule off for the
        whole project.
    - check: baseline
      text: >-
        `skylos baseline .` and then `--baseline` accept the routes you have
        and report only new ones.

related: [SKY-F102, SKY-D280, SKY-D241, SKY-D203]
