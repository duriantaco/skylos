id: SKY-A110
title: Test deleted
family: ai-defects
severity: HIGH
languages: [Python tests (pytest, unittest), JavaScript/TypeScript tests (Jest, Vitest, Mocha, node:test, Playwright)]
gate:
  full: not_run
  note: >-
    Only `skylos done` reports it, in its `test_tampering` check, which
    blocks by default: one deleted test fails the verdict. A test deleted
    together with the code it tested, a rewritten test, or one with fewer
    assertions is listed as advice and does not block. `skylos cicd
    risk-review` counts a blocking finding as "tests weakened", which needs
    a human approval.
run_with: >-
  `skylos done` (compares uncommitted changes with `HEAD`) or
  `skylos done --base origin/main` for a pull request; agent hooks run it
  when the agent stops
verify:
  mode: manual
  reason: >-
    Only `skylos done` runs this rule; the handbook build runs `skylos .`
    scans, which never report it.

what_it_is: >-
  A test that existed at the base commit is gone after the change, and no
  test with the same body exists anywhere else. SKY-A110 also reports a test
  left with no assertion at all, a test overwritten in place by one that
  tests something else, and a parametrized test that lost cases.

why_it_matters: >-
  When a coding agent cannot make a test pass, deleting the test is the
  fastest way to a green run. The behaviour that test protected then has no
  check at all, and a deleted block in a long diff is easy to miss in
  review.

flagged_example:
  language: python
  setup: git_diff
  expect_file: tests/test_discounts.py
  base_files:
    - filename: billing/discounts.py
      code: |
        """Discount rules for the checkout."""


        def apply_discount(price, percent):
            if not 0 <= percent <= 100:
                raise ValueError("percent must be between 0 and 100")
            return round(price * (100 - percent) / 100, 2)
    - filename: tests/test_discounts.py
      code: |
        import pytest

        from billing.discounts import apply_discount


        def test_applies_percentage():
            assert apply_discount(200, 25) == 150


        def test_rejects_percent_over_100():
            with pytest.raises(ValueError):
                apply_discount(200, 120)
  files:
    - filename: billing/discounts.py
      code: |
        """Discount rules for the checkout."""


        def apply_discount(price, percent):
            percent = min(max(percent, 0), 100)
            return round(price * (100 - percent) / 100, 2)
    - filename: tests/test_discounts.py
      code: |
        import pytest

        from billing.discounts import apply_discount


        def test_applies_percentage():
            assert apply_discount(200, 25) == 150

