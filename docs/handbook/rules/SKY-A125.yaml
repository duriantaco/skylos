id: SKY-A125
title: Scanner suppression marker added
family: ai-defects
severity: MEDIUM
languages: [Any file with comments (Python, JavaScript/TypeScript, Go, Java, PHP, Ruby, C/C++, Terraform, YAML, shell, Dockerfiles and more)]
gate:
  full: counted
  note: >-
    Counts toward `max_ai_defects` when the scan has a change to compare.
    `skylos done` lists it under `guardrail_tampering`, which advises by
    default.
run_with: >-
  `skylos . --ai-defects --diff origin/main` (or `-a`) on a change; also
  `skylos done`

what_it_is: >-
  Code-scanning platforms such as DeepSource, Checkov, Trivy, CodeQL and
  SonarQube read special comments that tell them to stop reporting a line,
  a resource or a file. SKY-A125 reports a change that adds one of these
  markers.

why_it_matters: >-
  The marker hides a finding from a check that runs somewhere else, often in
  CI after the pull request is opened. A coding agent that cannot make that
  check pass can add one line, and the reviewer sees a comment rather than
  the weakness it hides.

flagged_example:
  language: python
  setup: git_diff
  expect_file: app/settings_loader.py
  expect_line: 8
  base_files:
    - filename: app/settings_loader.py
      code: |
        import json


        def load_settings(path):
            try:
                with open(path) as handle:
                    return json.load(handle)
            except (OSError, ValueError):
                return {}
  files:
    - filename: app/settings_loader.py
      code: |
        import json


        def load_settings(path):
            try:
                with open(path) as handle:
                    return json.load(handle)
            except Exception:  # skipcq: PYL-W0703
                return {}

not_flagged_example:
  language: python
  setup: git_diff
  base_files:
    - filename: app/settings_loader.py
      code: |
        import json


        def load_settings(path):
            try:
                with open(path) as handle:
                    return json.load(handle)
            except (OSError, ValueError):
                return {}
  files:
    - filename: app/settings_loader.py
      code: |
        import json


        def load_settings(path):
            try:
                with open(path) as handle:
                    return json.load(handle)
            except Exception:  # nosemgrep
                return {}
  why: >-
    In Python, JavaScript/TypeScript, Go, Rust, Java/Kotlin and C# files,
    `nosemgrep` and `NOSONAR` belong to SKY-A118, which `skylos done`
    reports. SKY-A125 leaves them alone there so the same comment is not
    reported twice.

