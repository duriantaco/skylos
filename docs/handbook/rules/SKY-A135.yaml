fix:
  explanation: >-
    Delete the orphan in the same change (here, remove `price_label` from
    `app/pricing.py`, or the whole file once it holds nothing else), or
    point the old callers back at it if dropping them was a mistake.

false_alarms_and_suppression:
  misfires:
    - >-
      Code reached only by reflection, string dispatch or a plugin system
      the dead-code engine does not know looks unused, as it does for
      SKY-U001.
    - >-
      Public library API that only other packages call is reported once its
      last caller in this repository goes away.
    - >-
      Languages whose engine is not installed (Go without `skylos-go`, Dart
      without Dart support) are listed as not checked, not passed.
  suppress:
    - text: >-
        `skylos done` does not read `# skylos: ignore` comments for this
        rule. The check advises by default. To keep it advisory, or to turn
        it off, set its mode in the base commit's `pyproject.toml`.
      language: toml
      code: |
        [tool.skylos.done.checks]
        branch_orphans = "off"

related: [SKY-A136, SKY-A137, SKY-U001, SKY-U004]
