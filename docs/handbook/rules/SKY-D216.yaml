fix:
  explanation: >-
    Parse the URL and accept only hosts you chose in advance, with the
    `https` scheme. Reject everything else before the request is sent. If
    you must allow any public site, resolve the name and refuse private,
    loopback and link-local addresses as well.
  filename: app/preview.py
  code: |
    from urllib.parse import urlparse

    import requests

    from flask import Flask, abort, request

    app = Flask(__name__)
    ALLOWED_HOSTS = {"example.com", "docs.example.com"}


    @app.get("/preview")
    def preview():
        url = request.args.get("url", "")
        if urlparse(url).hostname not in ALLOWED_HOSTS:
            abort(400)
        page = requests.get(url, timeout=5)
        return {"status": page.status_code, "length": len(page.text)}

false_alarms_and_suppression:
  misfires:
    - >-
      An allowlist check made inside another function, such as
      `ensure_allowed(url)`, is not seen: the URL is still reported.
    - >-
      In TypeScript and JavaScript, a `fetch()` of a URL built from a
      function parameter is reported as MEDIUM even when every caller passes
      a fixed address.
    - >-
      An allowlist kept in a local variable or a module-level string is not
      accepted as a guard; use a literal set or a module-level collection.
  suppress:
    - check: inline
      text: >-
        Silence one line and say why. A bare `# noqa` does not hide HIGH or
        CRITICAL security findings.
      language: python
      code: |
        page = requests.get(url)  # skylos: ignore[SKY-D216] url checked by ensure_allowed()
    - check: baseline
      text: >-
        Accept the findings you already have with `skylos baseline .`, then
        scan with `--baseline` so only new ones are listed.
    - check: config
      text: >-
        `[tool.skylos] ignore = ["SKY-D216"]` turns the rule off for the
        whole project.

related: [SKY-D218, SKY-D230, SKY-D356, SKY-D248]
