id: SKY-Q804
title: Stable module depends on an unstable one
family: quality
severity: VARIES
severity_note: >-
  The catalog gives no severity. HIGH when the stable module's instability
  is below 0.1, MEDIUM otherwise.
languages: [Python, TypeScript, JavaScript]
gate:
  full: counted
  note: >-
    A measurement, not listed by default. It is listed, and counted toward
    `max_quality`, with `--all-advice` or when the rule is named in
    `[tool.skylos.gate] rules`.

what_it_is: >-
  A module's instability (I) is the share of its import links that point
  outward: the modules it imports, divided by those plus the modules that
  import it. SKY-Q804 reports a stable module (I below 0.3, many importers)
  that imports an unstable one (I above 0.7, which itself imports a lot).
  The catalog calls this a dependency inversion violation.

why_it_matters: >-
  Everything that imports the stable module now also depends, through it,
  on a module that changes whenever any of its own dependencies change. A
  tweak to a theme or a locale table can then break the data models that
  half the project imports.

flagged_example:
  language: python
  files:
    - filename: shop/models.py
      code: |
        """Shop data records."""

        from shop.formatting import money


        class Order:
            def __init__(self, order_id, total):
                self.order_id = order_id
                self.total = total

            def label(self):
                return f"Order {self.order_id}: {money(self.total)}"
    - filename: shop/formatting.py
      code: |
        """Display helpers."""

        from shop.locale import currency_symbol
        from shop.settings import DECIMALS
        from shop.themes import highlight


        def money(amount):
            return highlight(f"{currency_symbol()}{amount:.{DECIMALS}f}")
    - filename: shop/locale.py
      code: |
        """Locale data."""


        def currency_symbol():
            return "$"
    - filename: shop/settings.py
      code: |
        """Display settings."""

        DECIMALS = 2
    - filename: shop/themes.py
      code: |
        """Text themes."""


        def highlight(text):
            return f"*{text}*"
    - filename: shop/views.py
      code: |
        """Web views."""

        from shop.models import Order


        def order_page(order_id):
            return Order(order_id, 10).label()
    - filename: shop/jobs.py
      code: |
        """Background jobs."""

        from shop.models import Order


        def nightly(ids):
            return [Order(i, 0).label() for i in ids]
    - filename: shop/api.py
      code: |
        """JSON API."""

        from shop.models import Order


        def order_json(order_id):
            return {"label": Order(order_id, 10).label()}
    - filename: shop/__init__.py
      code: |
        """The shop package."""
  expect_file: shop/models.py
  expect_line: 1

