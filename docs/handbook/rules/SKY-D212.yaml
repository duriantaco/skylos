fix:
  explanation: >-
    Run a fixed program with an argument list and no shell. Each value is
    then one argument and can never start another command. Check the value
    too (for example that it is a host name), so it cannot pass an option
    such as `-f` to the program.
  filename: app/tools.py
  code: |
    import subprocess

    from flask import Flask, request

    app = Flask(__name__)


    @app.post("/ping")
    def ping():
        host = request.form.get("host", "")
        out = subprocess.run(["ping", "-c", "1", "--", host], capture_output=True)
        return {"output": out.stdout.decode()}

false_alarms_and_suppression:
  misfires:
    - >-
      A helper that receives the command as a parameter, such as
      `def run(cmd): subprocess.run(cmd, shell=True)`, is reported even when
      every caller passes a constant. Parameters count as untrusted.
    - >-
      A value checked against an allowlist before the call is still
      reported: the check is not recognised.
    - >-
      The same line usually also gets SKY-D209 (`shell=True`) or SKY-D203
      (`os.system`), which report the call itself whatever its input.
  suppress:
    - check: inline
      text: >-
        Silence one line and say why. Only the listed rule is hidden. A bare
        `# noqa` does not hide HIGH or CRITICAL security findings.
      language: python
      code: |
        subprocess.run(cmd, shell=True)  # skylos: ignore[SKY-D212] cmd is from COMMANDS
    - check: baseline
      text: >-
        Accept the findings you already have with `skylos baseline .`, then
        scan with `--baseline` so only new ones are listed.
    - check: config
      text: >-
        `[tool.skylos] ignore = ["SKY-D212"]` turns the rule off for the
        whole project, real injections included.

related: [SKY-D203, SKY-D209, SKY-D235, SKY-D211]
