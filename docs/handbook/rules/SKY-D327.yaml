fix:
  explanation: >-
    Upload only what the receiver needs: write the chosen values to a file
    and send that file, or name the variables one by one. If a secret really
    must reach another service, send it in a header to the service it
    belongs to, not as the payload of a debug or paste endpoint.
  filename: scripts/support-bundle.sh
  code: |
    #!/usr/bin/env bash
    # Collect build details for a support ticket.
    set -euo pipefail

    echo "node $(node --version), npm $(npm --version)" > support-bundle.txt
    curl -s -X POST https://paste.example.dev/upload --data-binary @support-bundle.txt

false_alarms_and_suppression:
  misfires:
    - >-
      In shell, CI and Dockerfile commands, a secret-named variable is
      reported wherever it appears in a network command, including the
      normal `curl -H "Authorization: Bearer $OPENAI_API_KEY"
      https://api.openai.com/…`. The Python and TypeScript checks ignore
      headers; the shell check does not.
    - >-
      Template and example files count as credential files by name:
      uploading `.env.example` or a `config.json` is reported. Copying a real
      `.env` to your own server with `scp` is reported too.
    - >-
      In Python, one harmless value such as
      `json={"release": os.environ.get("RELEASE")}` is enough to report the
      call: any `os.environ` read inside the payload counts.
    - >-
      Missed: `ssh user@host` without a `:path` is not recognised as an
      outside host, and in a GitHub Actions `run: |` block, or a multi-line
      GitLab item, the block is split only at `;`, `&&`, `||` and `|`, not at
      line breaks, so a pipeline that starts on a later line is read as
      arguments of the first command and is not reported.
  suppress:
    - check: inline
      text: >-
        In a shell script, put the marker on the reported line, as a real
        comment. In GitHub Actions, GitLab CI and Dockerfiles the marker may
        also sit on the line directly above, with exactly one rule per marker.
      language: shell
      code: |
        scp .env deploy@app1:/srv/app/.env  # skylos: ignore[SKY-D327] our own server
    - check: config
      text: >-
        `[tool.skylos] ignore = ["SKY-D327"]` turns the rule off for the whole
        project, which also hides a real exfiltration added later.

related: [SKY-D338, SKY-D328, SKY-S101, SKY-D339]
