    note: the settings the scan uses and the severity.

fix:
  explanation: >-
    Move the shared steps into one helper and keep only what really differs,
    here the column headers, in the callers. A fix to the filter then
    reaches every export.
  code: |
    """CSV exports for the finance team."""

    import csv
    import io


    def _rows_to_csv(header, records, currency):
        buffer = io.StringIO()
        writer = csv.writer(buffer)
        writer.writerow(header)
        for record in records:
            if record.currency != currency:
                continue
            amount = f"{record.total:.2f}"
            writer.writerow([record.id, record.customer_email, record.created, amount])
        return buffer.getvalue()


    def export_orders(orders, currency):
        return _rows_to_csv(["id", "customer", "date", "amount"], orders, currency)


    def export_invoices(invoices, currency):
        return _rows_to_csv(["invoice", "email", "issued", "total"], invoices, currency)

false_alarms_and_suppression:
  misfires:
    - >-
      Copies that read different attributes or call different methods (for
      example `refund.amount` where the original reads `order.total`) are
      usually missed, because their reduced forms are no longer identical
      and the pair is never compared.
    - >-
      Code that must be repeated on purpose, such as two migrations or two
      plugin classes that a framework requires to stand alone, is reported.
  suppress:
    - check:
        kind: inline
        expect: reported
      text: >-
        An inline marker does **not** work for this rule: with this comment
        on the reported `def` line, the group is still reported.
      language: python
      code: |
        def export_invoices(invoices, currency_code):  # skylos: ignore[SKY-C401] kept apart
    - check: config
      text: >-
        `[tool.skylos] ignore = ["SKY-C401"]` turns the rule off for the
        project. A baseline accepts existing findings, but it records the
        absolute file path and the line, so an entry stops matching when the
        checkout moves or the line shifts.

related: [SKY-Q305, SKY-C304, SKY-L027]
