id: SKY-G206
title: Go unsafe package use
family: go
severity: LOW
languages: [Go]
gate:
  full: counted

what_it_is: >-
  Go's `unsafe` package lets code read and write memory outside the type
  system, for example by turning any pointer into any other. SKY-G206
  reports each call into `unsafe`, such as `unsafe.Pointer(p)`,
  `unsafe.Sizeof(x)` or `unsafe.String(...)`, so a person reviews it. The
  catalog calls the rule "Go unsafe package import", but an import alone is
  not reported.

why_it_matters: >-
  A wrong `unsafe` conversion is not caught by the compiler or the race
  detector. It shows up as corrupted data or a crash much later, often
  only under load, and it can break when the Go version or the struct
  layout changes.

flagged_example:
  language: go
  filename: store/cache.go
  expect_line: 21
  code: |
    package store

    import (
    	"sync/atomic"
    	"unsafe"
    )

    type Snapshot struct {
    	Prices map[string]int64
    }

    type Cache struct {
    	current unsafe.Pointer
    }

    func (c *Cache) Load() *Snapshot {
    	return (*Snapshot)(atomic.LoadPointer(&c.current))
    }

    func (c *Cache) Store(s *Snapshot) {
    	atomic.StorePointer(&c.current, unsafe.Pointer(s))
    }

not_flagged_example:
  language: go
  filename: store/cache_test.go
  code: |
    package store

    import (
    	"testing"
    	"unsafe"
    )

    func TestCacheIsOnePointer(t *testing.T) {
    	if size := unsafe.Sizeof(Cache{}); size != unsafe.Sizeof(uintptr(0)) {
    		t.Fatalf("Cache is %d bytes, want one pointer", size)
    	}
    }
  why: >-
    The calls are in a `_test.go` file, which only `go test` compiles. The
    Go engine does not scan test files, so test-only uses of `unsafe` are
    not reported.

how_skylos_decides:
  - >-
    Runs with `--danger`. The bundled Go engine, `skylos-go`, parses each
    `.go` file with Go's own parser. `_test.go` files, symbolic links and
    files under `vendor`, `testdata`, `node_modules` and hidden folders are
    skipped. A `go.mod` is not required.
  - >-
    Resolves each call's package through the file's imports and reports
    every call whose package is `unsafe`: `unsafe.Pointer(...)`,
    `unsafe.Sizeof`, `unsafe.Offsetof`, `unsafe.Add`, `unsafe.Slice`,
    `unsafe.String` and the rest.
  - >-
    A type written as `unsafe.Pointer` (a field or a variable declaration)
    is not a call and is not reported.
  - >-
    Reports LOW on the line of the call. The ID stays SKY-G206 in the
    output; it is not renamed to a cross-language rule.

source_refs:
  - path: skylos/engines/go/internal/analyzer/analyzer.go
    symbol: "// SKY-G206: Unsafe package usage."
  - path: skylos/engines/go/internal/analyzer/analyzer.go
    symbol: "var defaultSkipDirs = map[string]bool{"
  - path: skylos/visitors/languages/go/go.py
    symbol: "_GO_RULE_REMAP"
    note: G206 is not renamed.

fix:
  explanation: >-
    Use the typed `sync/atomic.Pointer[T]` (Go 1.19 and later) instead of
    converting through `unsafe.Pointer`. It does the same lock-free swap
    and the compiler checks the type.
  filename: store/cache.go
  code: |
    package store

    import "sync/atomic"

    type Snapshot struct {
    	Prices map[string]int64
    }

    type Cache struct {
    	current atomic.Pointer[Snapshot]
    }

    func (c *Cache) Load() *Snapshot {
    	return c.current.Load()
    }

    func (c *Cache) Store(s *Snapshot) {
    	c.current.Store(s)
    }

false_alarms_and_suppression:
  misfires:
    - >-
      Reviewed, deliberate uses in low-level code (a zero-copy parser, a
      binding to C) are reported each time; that is the point of a review
      prompt, but it adds noise in such packages.
    - >-
      `reflect.SliceHeader`, `reflect.StringHeader` and `//go:linkname`
      carry similar risks without a call into `unsafe` and are not
      reported.
  suppress:
    - check: inline
      text: >-
        At the end of the reported line; a comment on the line above is not
        read:
      language: go
      code: |
        atomic.StorePointer(&c.current, unsafe.Pointer(s)) // skylos: ignore[SKY-G206] reviewed
    - check: config
      text: >-
        `[tool.skylos] ignore = ["SKY-G206"]` in a `pyproject.toml` at the
        project root turns the rule off. A baseline accepts existing
        findings, but it records the absolute file path and the line, so an
        entry stops matching when the checkout moves or the line shifts.

related: [SKY-G203, SKY-G260]
