id: SKY-DEP003
title: Internet-facing Ingress routes to a server in reload mode
family: infrastructure
severity: MEDIUM
languages: [Kubernetes YAML, Uvicorn, Gunicorn, Flask]
gate:
  full: counted
  note: >-
    Reported under reliability. It counts toward `max_reliability`, which is 0
    by default, so one finding fails `--gate`.

what_it_is: >-
  Reload mode makes a development server watch its source files and restart
  when they change. SKY-DEP003 reports a Kubernetes deployment whose
  internet-facing Ingress routes to a Uvicorn, Gunicorn or Flask container
  started with `--reload`, or with Flask debug mode, which reloads too.

why_it_matters: >-
  The file watcher costs CPU in every pod, and Uvicorn's reloader runs a
  single worker process, so the service has less capacity than you think. Any
  file change inside the container restarts it mid-request.

flagged_example:
  language: yaml
  expect_file: deploy/api.yaml
  expect_line: 19
  files:
    - filename: app/main.py
      language: python
      code: |
        from fastapi import FastAPI

        app = FastAPI()


        @app.get("/orders")
        def orders():
            return {"orders": []}
    - filename: deploy/api.yaml
      code: |
        apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: api
          namespace: prod
        spec:
          selector:
            matchLabels:
              app: api
          template:
            metadata:
              labels:
                app: api
            spec:
              containers:
                - name: api
                  image: ghcr.io/acme/api:1.4.0
                  command: ["uvicorn"]
                  args: ["app.main:app", "--reload", "--host", "0.0.0.0", "--port", "8000"]
                  ports:
                    - name: http
                      containerPort: 8000
        ---
        apiVersion: v1
        kind: Service
        metadata:
          name: api
          namespace: prod
        spec:
          selector:
            app: api
          ports:
            - name: http
              port: 80
              targetPort: http
        ---
        apiVersion: networking.k8s.io/v1
        kind: Ingress
        metadata:
          name: api
          namespace: prod
          annotations:
            skylos.dev/network-scope: external
            skylos.dev/backend-protocol: http
        spec:
          rules:
            - host: api.example.com
              http:
                paths:
                  - path: /
                    pathType: Prefix
                    backend:
                      service:
                        name: api
                        port:
                          name: http

