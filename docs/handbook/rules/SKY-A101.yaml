fix:
  explanation: >-
    Keep the precise assertion and update the expected value to the new,
    intended behaviour. If the value really cannot be known any more, say
    why in the pull request and test a property that still matters, such as
    the type or a range.
  language: python
  code: |
    assert total == 2500

false_alarms_and_suppression:
  misfires:
    - >-
      A deliberate contract change, such as a function that now returns an
      opaque ID instead of a number, is reported. That is intended: it asks
      the reviewer to confirm the change.
    - >-
      A new test file that arrives already skipped is reported as HIGH once
      it is staged or committed in the diff. `skylos done` lists it as advice
      too: it exempts only lines inside a new test's body, and the skip
      decorator sits above the `def`.
    - >-
      If the checkout itself sits inside a folder named `tests` or `test`,
      every changed file counts as a test file, because the folder check
      reads the full path.
    - >-
      Because checks are compared within one hunk, a precise assertion moved
      further down the file can leave the weak one reported.
    - >-
      It does not see an assertion deleted outright, `== 2400` changed to
      `>= 0`, a looser `pytest.approx` tolerance, or an assertion moved into
      a helper function. In a `--diff` scan it also misses deletion-only
      changes such as a removed `pytest.raises` block.
  suppress:
    - text: >-
        On the added line, with the reason the weaker check is right:
      language: python
      code: |
        assert total is not None  # skylos: ignore[SKY-A101] total now comes from pricing
    - text: >-
        `[tool.skylos] ignore = ["SKY-A101"]` turns the rule off for the
        project.

related: [SKY-A110, SKY-A111, SKY-A112, SKY-A120]
