  files:
    - filename: billing/invoices.py
      code: |
        """Invoice maths for the checkout service."""

        TAX_RATE = 0.25


        def calculate_total(items):
            subtotal = sum(item["price"] * item["qty"] for item in items)
            return round(subtotal * (1 + TAX_RATE))
    - filename: tests/test_invoices.py
      code: |
        from billing.invoices import calculate_total


        def test_total_includes_tax():
            items = [{"price": 1000, "qty": 2}]
            total = calculate_total(items)

            assert total == 2500
  why: >-
    The tax rate changed and the test still checks one exact value, the new
    one. Changing an expected value is a normal part of changing behaviour;
    only a swap from a precise check to a vague one is reported.

how_skylos_decides:
  - >-
    Runs with `--ai-defects` when there is a change to compare: in a diff
    scan (`--diff` or `--diff-base`), or in a full scan of a Git checkout
    with uncommitted changes (in CI, the pull request's changes when the
    base branch is known and fetched). It reads the Git diff of each changed
    file against the base; untracked files have no diff and are skipped.
  - >-
    Looks only at test files: a `tests`, `test` or `__tests__` folder
    anywhere in the file's full path, `test_*`, `*_test.py`, `test.py` and
    `tests.py` names, `.test.` and `.spec.` files, and snapshot files.
  - >-
    Splits each changed hunk by test, and classes every removed and added
    line. Strong checks compare a value or an exception: `==`, `<`, `in`,
    `pytest.raises`, `assertEqual`, `toBe`, `toEqual`, `toThrow`. Weak
    checks only test that something exists or is truthy: a bare `assert x`,
    `is not None`, `assertTrue`, `assertIsNotNone`, `toBeDefined`,
    `toBeTruthy`.
  - >-
    For each test in the hunk, reports the first weakening, in this order:
    a skip or `xfail` added; snapshot content changed or removed; an
    exception check loosened (`match=` dropped, widened to `Exception`) or
    removed; a negative test deleted; a mock check broadened
    (`assert_called_once_with` to `assert_called`); `spec=` or `autospec`
    removed from a mock; an expected value replaced by `ANY`; `== v` widened
    to `in (v, …)`; a value check turned into a length check; a behaviour
    check replaced by `is not None`; or a strong check replaced by a weak
    one with no new strong check in the same hunk.
  - >-
    Reports on the added line in the new file. A hunk that only deletes
    lines (a removed `pytest.raises`, a deleted negative test) is reported
    at its line in the base version, and only by a full scan: a `--diff`
    scan drops findings on deleted lines. In `skylos done` the findings are
    advice and do not block.

