id: SKY-A101
title: Test assertion weakened
family: ai-defects
severity: MEDIUM
severity_note: >-
  HIGH when the change skips a test or marks it `xfail`, removes an
  exception assertion such as `pytest.raises`, or deletes a negative test
  (one named for rejecting bad input). LOW for changed or removed snapshot
  content.
languages: [Python tests (pytest, unittest), JavaScript/TypeScript tests (Jest, Vitest, node:assert), snapshot files]
run_with: >-
  `skylos . --ai-defects --diff origin/main` (or `-a`) on a change; also
  listed as advice by `skylos done`

what_it_is: >-
  A test is weakened when a change replaces a precise check with a vague
  one: `== 2400` becomes `is not None`, `pytest.raises(ValueError, match=…)`
  disappears, or the test gets skipped. SKY-A101 compares each changed test
  file with the base version and reports these swaps.

why_it_matters: >-
  A coding agent that cannot make a test pass sometimes edits the test
  instead of the code. The suite stays green while the behaviour it
  protected is no longer checked, and reviewers rarely spot a one-line
  change in a test file.

flagged_example:
  language: python
  setup: git_diff
  expect_file: tests/test_invoices.py
  expect_line: 8
  base_files:
    - filename: billing/invoices.py
      code: |
        """Invoice maths for the checkout service."""

        TAX_RATE = 0.2


        def calculate_total(items):
            subtotal = sum(item["price"] * item["qty"] for item in items)
            return round(subtotal * (1 + TAX_RATE))
    - filename: tests/test_invoices.py
      code: |
        from billing.invoices import calculate_total


        def test_total_includes_tax():
            items = [{"price": 1000, "qty": 2}]
            total = calculate_total(items)

            assert total == 2400
  files:
    - filename: billing/invoices.py
      code: |
        """Invoice maths for the checkout service."""

        TAX_RATE = 0.25


        def calculate_total(items):
            subtotal = sum(item["price"] * item["qty"] for item in items)
            return round(subtotal * (1 + TAX_RATE))
    - filename: tests/test_invoices.py
      code: |
        from billing.invoices import calculate_total


        def test_total_includes_tax():
            items = [{"price": 1000, "qty": 2}]
            total = calculate_total(items)

            assert total is not None

