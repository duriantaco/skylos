id: SKY-DEP001
title: Internet-facing route is missing the auth guard your deployment requires
family: infrastructure
severity: HIGH
languages: [Python (FastAPI, Flask), Kubernetes YAML]
gate:
  full: counted
  note: >-
    Reported under security (`danger`). It counts toward `max_high` and
    `max_security`.

what_it_is: >-
  Your Kubernetes manifest can declare which guard functions must protect a
  service's sensitive routes, with the annotation
  `skylos.dev/required-guards`. SKY-DEP001 follows the internet-facing Ingress
  to the Python app it serves and reports an admin, internal, debug or metrics
  route that lacks one of those guards.

why_it_matters: >-
  An admin endpoint without its auth check is open to anyone who finds the
  URL, and `/admin` paths are the first thing scanners try. Linters cannot see
  this, because whether a route is reachable from the internet is decided in
  the deployment files, not in the code.

flagged_example:
  language: python
  expect_file: app/main.py
  expect_line: 13
  files:
    - filename: app/main.py
      code: |
        from fastapi import Depends, FastAPI

        from app.auth import require_admin

        app = FastAPI()


        @app.get("/health")
        def health():
            return {"ok": True}


        @app.get("/admin/users")
        def list_admin_users():
            return {"users": []}
    - filename: app/auth.py
      code: |
        from fastapi import Header, HTTPException


        def require_admin(x_role: str = Header(default="")):
            if x_role != "admin":
                raise HTTPException(status_code=403)
            return x_role
    - filename: deploy/api.yaml
      language: yaml
      code: |
        apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: api
          namespace: prod
        spec:
          selector:
            matchLabels:
              app: api
          template:
            metadata:
              labels:
                app: api
              annotations:
                skylos.dev/source-file: app/main.py
                skylos.dev/required-guards: require_admin
            spec:
              containers:
                - name: api
                  image: ghcr.io/acme/api:1.4.0
                  command: ["uvicorn"]
                  args: ["app.main:app", "--host", "0.0.0.0", "--port", "8000"]
                  ports:
                    - name: http
                      containerPort: 8000
        ---
        apiVersion: v1
        kind: Service
        metadata:
          name: api
          namespace: prod
        spec:
          selector:
            app: api
          ports:
            - name: http
              port: 80
              targetPort: http
        ---
        apiVersion: networking.k8s.io/v1
        kind: Ingress
        metadata:
          name: api
          namespace: prod
          annotations:
            skylos.dev/network-scope: external
            skylos.dev/backend-protocol: http
        spec:
          rules:
            - host: api.example.com
              http:
                paths:
                  - path: /
                    pathType: Prefix
                    backend:
                      service:
                        name: api
                        port:
                          name: http

