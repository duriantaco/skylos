  why: >-
    The same deployment and the same route, now with `Depends(require_admin)`,
    the guard the manifest requires. `/health` has no guard either, but it is
    not a sensitive path.

how_skylos_decides:
  - >-
    Runs with `--danger` (or `-a`). Reads Kubernetes YAML in the repository
    and only works when an `Ingress` opts in with the annotations
    `skylos.dev/network-scope: external` (or `internet`, `public`) and
    `skylos.dev/backend-protocol: http`.
  - >-
    Follows one chain inside one YAML file: Ingress path, to the `Service` and
    port it names, to the one workload the Service selects, to the one
    container whose port the Service targets. The server must be started with
    a literal `command` and `args` (`uvicorn`, `gunicorn`, `flask run`, or
    `python -m` one of them) bound to `0.0.0.0` or `::` on that port.
  - >-
    Any missing, dynamic or ambiguous link (two matching workloads, a Helm
    template value, HTTPS or gRPC backends, rewrite or snippet annotations)
    makes it report nothing rather than guess.
  - >-
    The workload's pod template must also carry `skylos.dev/source-file` (the
    Python file the server's `module:app` target names) and
    `skylos.dev/required-guards` (a comma-separated list of guard names).
  - >-
    In that file it reads the top-level FastAPI or Flask routes of the app
    object. A route counts as sensitive when its path, as reached through the
    Ingress, has a segment such as `admin`, `internal`, `debug`, `manage`,
    `metrics` or `pprof`.
  - >-
    A guard counts only under its exact name: in the app's or the route's
    `dependencies`, as a `Depends(...)` parameter, or as a decorator on the
    handler. A check inside the function body does not count.
  - >-
    Reports HIGH on the route's decorator line, naming the missing guards.

source_refs:
  - path: skylos/rules/config/deployment/exposure.py
    symbol: 'REQUIRED_GUARDS_ANNOTATION = "skylos.dev/required-guards"'
  - path: skylos/rules/config/deployment/exposure.py
    symbol: 'EXPOSURE_SCOPE_ANNOTATION = "skylos.dev/network-scope"'
  - path: test/test_deployment_exposure.py
    symbol: "def test_proves_bundle_entrypoint_source_route_and_missing_contract_guard("

fix:
  explanation: >-
    Add the required guard to the route, as a dependency or a decorator, so
    the contract in the manifest holds.
  filename: app/main.py
  language: python
  code: |
    from fastapi import Depends, FastAPI

    from app.auth import require_admin

    app = FastAPI()


    @app.get("/health")
    def health():
        return {"ok": True}


    @app.get("/admin/users")
    def list_admin_users(user=Depends(require_admin)):
        return {"users": []}

false_alarms_and_suppression:
  misfires:
    - >-
      Routes added through nested routers (`include_router`, blueprints) or
      factory functions are not checked.
    - >-
      It checks that the guard is wired in, not what the guard does.
    - >-
      Without the two Ingress annotations the rule never runs. Keep them in a
      protected place: removing them silences the rule.
    - >-
      Resources split across several YAML files, Helm charts and Kustomize
      overlays are not joined or rendered. Scan rendered manifests.
  suppress:
    - check: inline
      text: >-
        Put the marker on the reported decorator line.
      language: python
      code: |
        @app.get("/admin/users")  # skylos: ignore[SKY-DEP001] VPN only
    - check: config
      text: >-
        `[tool.skylos] ignore = ["SKY-DEP001"]` turns the rule off for the
        project.
    - check: baseline
      text: >-
        A baseline (`skylos baseline .`, then `--baseline`) accepts the
        findings that exist today and reports new ones.

related: [SKY-DEP002, SKY-DEP003, SKY-D241]
