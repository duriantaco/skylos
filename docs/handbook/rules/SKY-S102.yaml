fix:
  explanation: >-
    Keep the secret on the server. Move the call that needs it into a
    server route or server action and let the browser call that route. If
    a secret has already shipped in a bundle, revoke it.
  filename: app/checkout/PayButton.tsx
  language: tsx
  code: |
    "use client";

    import { useState } from "react";

    export function PayButton({ amount }: { amount: number }) {
      const [busy, setBusy] = useState(false);

      async function pay() {
        setBusy(true);
        await fetch("/api/checkout", {
          method: "POST",
          body: JSON.stringify({ amount }),
        });
        setBusy(false);
      }

      return <button disabled={busy} onClick={pay}>Pay</button>;
    }

false_alarms_and_suppression:
  misfires:
    - >-
      Next.js only puts variables with the `NEXT_PUBLIC_` prefix into the
      browser bundle, so `process.env.STRIPE_SECRET_KEY` in a client
      component is usually `undefined` at run time rather than leaked. It
      is still reported: the code is broken either way, and other bundlers
      and build settings do inline it.
    - >-
      Any path that contains `/client/`, `/dist/`, `/build/` or
      `/frontend/` counts as browser code, so a server-side package in a
      folder named `client` can be reported.
    - >-
      A public variable whose name contains `SECRET` or `TOKEN` is reported
      even when the value is meant to be public, such as a CAPTCHA site
      token.
  suppress:
    - check:
        kind: example
        example:
          language: tsx
          filename: app/checkout/PayButton.tsx
          code: |
            "use client";

            import { useState } from "react";

            const stripeKey = process.env.STRIPE_SECRET_KEY; // skylos: ignore[SKY-S102] proxy

            export function PayButton({ amount }: { amount: number }) {
              const [busy, setBusy] = useState(false);

              async function pay() {
                setBusy(true);
                await fetch("https://api.stripe.com/v1/payment_intents", {
                  method: "POST",
                  headers: { Authorization: `Bearer ${stripeKey}` },
                  body: new URLSearchParams({ amount: String(amount), currency: "usd" }),
                });
                setBusy(false);
              }

              return <button disabled={busy} onClick={pay}>Pay</button>;
            }
      text: >-
        Mark a reviewed line with a real comment on the same line. A marker
        on the line above is not read.
      language: tsx
      code: |
        const stripeKey = process.env.STRIPE_SECRET_KEY; // skylos: ignore[SKY-S102] proxy
    - check: {kind: config, expect: reported}
      text: >-
        `[tool.skylos] ignore = ["SKY-S102"]` has no effect on the secrets
        scan: its findings stay reported and still fail the gate.
    - check: baseline
      text: >-
        A baseline (`skylos baseline .`, then `--baseline`) accepts existing
        findings by file and line. Revoke any secret that has shipped.

related: [SKY-S101, SKY-D244]
