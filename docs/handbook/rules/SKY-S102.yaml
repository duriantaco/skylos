id: SKY-S102
title: Secret exposed to code that runs in the browser
family: secrets
severity: HIGH
severity_note: >-
  A server-only environment variable read in browser code is HIGH. A
  hardcoded secret found in a browser-loaded file keeps the severity
  SKY-S101 gave it, so a provider key such as a Stripe secret key is
  reported as CRITICAL.
languages: [TypeScript/JavaScript, HTML, Vue, Svelte, Astro, and any file the secrets scan reads under a public folder]
gate:
  full: blocks
  note: Any secret fails the gate, whatever the limits.

what_it_is: >-
  Code that runs in the browser is downloaded by every visitor, so anything
  in it is public. SKY-S102 reports a secret, or a reference to a
  server-only environment variable such as `process.env.STRIPE_SECRET_KEY`,
  in a file that is bundled for or served to the browser.

why_it_matters: >-
  A bundler copies the value into the JavaScript it ships, and anyone can
  read it with the browser's developer tools. A Stripe secret key or a
  database URL found this way lets a stranger charge cards, read customer
  data or delete records.

fragments:
  STRIPE_SECRET_DEMO: ["sk_live_", "51HandbookDemo0nly"]
  STRIPE_PUBLISHABLE_DEMO: ["pk_live_", "51HandbookDemo0nly"]

flagged_example:
  language: tsx
  filename: app/checkout/PayButton.tsx
  expect_line: 5
  code: |
    "use client";

    import { useState } from "react";

    const stripeKey = process.env.STRIPE_SECRET_KEY;

    export function PayButton({ amount }: { amount: number }) {
      const [busy, setBusy] = useState(false);

      async function pay() {
        setBusy(true);
        await fetch("https://api.stripe.com/v1/payment_intents", {
          method: "POST",
          headers: { Authorization: `Bearer ${stripeKey}` },
          body: new URLSearchParams({ amount: String(amount), currency: "usd" }),
        });
        setBusy(false);
      }

      return <button disabled={busy} onClick={pay}>Pay</button>;
    }

not_flagged_example:
  language: tsx
  filename: app/checkout/PayButton.tsx
  code: |
    "use client";

    import { loadStripe } from "@stripe/stripe-js";

    const stripe = loadStripe(process.env.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY!);

    export function PayButton({ clientSecret }: { clientSecret: string }) {
      async function pay() {
        const client = await stripe;
        await client?.confirmPayment({ clientSecret, confirmParams: {} });
      }

      return <button onClick={pay}>Pay</button>;
    }
  why: >-
    The component still runs in the browser, but it reads a publishable key,
    which Stripe designs to be public. The `NEXT_PUBLIC_` prefix says the
    value is meant for the browser, and the rest of the name has no word
    such as `SECRET`, `TOKEN` or `PASSWORD`. `KEY` alone is not enough under
    a public prefix.

more_examples:
  - flagged:
      language: html
      filename: static/checkout/index.html
      expect_line: 9
      code: |
        <!doctype html>
        <html>
          <head>
            <script src="https://js.stripe.com/v3/"></script>
          </head>
          <body>
            <button id="pay">Pay</button>
            <script>
              const stripe = Stripe("{{STRIPE_SECRET_DEMO}}");
            </script>
          </body>
        </html>
    not_flagged:
      language: html
      filename: static/checkout/index.html
      code: |
        <!doctype html>
        <html>
          <head>
            <script src="https://js.stripe.com/v3/"></script>
          </head>
          <body>
            <button id="pay">Pay</button>
            <script>
              const stripe = Stripe("{{STRIPE_PUBLISHABLE_DEMO}}");
            </script>
          </body>
        </html>
      why: >-
        A publishable key (`pk_live_…`) is not a secret, so no secret
        pattern matches it. The secret key in the flagged page is a SKY-S101
        match that Skylos reports as SKY-S102, CRITICAL, because the file
        sits under `static/`.

how_skylos_decides:
  - >-
    Runs the secrets scan (`--secrets` or `-a`) and decides for each file
    whether the browser loads it. A path containing `/public/`, `/static/`,
    `/assets/`, `/.next/static/`, `/build/client/`, `/dist/client/` or
    `/out/` always counts.
  - >-
    Otherwise, server paths do not count: `pages/api/`, `route.ts` and the other
    `route.*` files under `app/`, files with `.server.` in the name, and
    server output such as `.next/server/` or `dist/server/`.
  - >-
    Otherwise a file counts when it is named `client.*`, `browser.*`,
    `*.client.*` or `*.browser.*` and is a JavaScript, TypeScript, Vue,
    Svelte, Astro or HTML file; when its path contains `/frontend/`,
    `/client/`, `/dist/`, `/build/`, `/assets/`, `/.next/` or `/out/`; or
    when it is a JavaScript or TypeScript file whose first statement is the
    `"use client"` directive.
  - >-
    In such a file, every SKY-S101 finding (a hardcoded key or password) is
    renamed SKY-S102 and keeps its severity.
  - >-
    In JavaScript and TypeScript files it also parses the code and reports
    each read of `process.env.NAME`, `import.meta.env.NAME` and their
    aliases and destructured forms, as HIGH, when the name looks sensitive:
    it contains `SECRET`, `TOKEN`, `PASSWORD`, `PASSWD`, `PRIVATE`,
    `CREDENTIAL`, `AUTH` or `KEY`, or is `DATABASE_URL`, `DB_URL`,
    `MONGODB_URI`, `MONGO_URI` or `REDIS_URL`.
  - >-
    Under a public prefix (`NEXT_PUBLIC_`, `REACT_APP_`, `VITE_`,
    `NUXT_PUBLIC_`, `EXPO_PUBLIC_`, `PUBLIC_`), `KEY` and `AUTH` no longer
    count, so `NEXT_PUBLIC_MAPS_KEY` is quiet while
    `NEXT_PUBLIC_API_SECRET` is reported.
  - >-
    When the file is too large or too broken to parse completely and a
    sensitive name appears, it reports that the analysis was incomplete
    instead of staying silent.

