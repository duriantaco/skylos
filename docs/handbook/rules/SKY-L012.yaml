fix:
  explanation: >-
    Call the helper that really exists, or write the missing one in the
    module the code imports it from. Do not silence the finding by catching
    the resulting `AttributeError`: the check would still never run.
  language: python
  filename: app/views.py
  code: |
    from app import auth


    def get_invoice(request, invoice_id, secret):
        header = request.headers["Authorization"]
        if not auth.verify_access_token(header, secret):
            return {"status": 401}
        return {"status": 200, "invoice": invoice_id}

false_alarms_and_suppression:
  misfires:
    - >-
      A module that adds names at run time in a way Skylos cannot follow,
      for example a plugin loader that calls `setattr()` on another module
      with a computed name, can make a real name look missing.
    - >-
      A bare call to a security-helper name such as `sanitize_input()` is
      reported when the name comes from a star import of an installed
      package or a `builtins` patch, because the file neither defines nor
      imports it by name.
    - >-
      To add your own helper names to the security list, set
      `extra_phantom_names` under `[tool.skylos.vibe]`.
  suppress:
    - check: inline
      text: >-
        On the reported line, with the reason the name exists at run time:
      language: python
      code: |
        if not auth.verify_token(header, secret):  # skylos: ignore[SKY-L012] plugin adds it
    - check: config
      text: >-
        `[tool.skylos] ignore = ["SKY-L012"]` turns the rule off for the
        project.

related: [SKY-L023, SKY-D224, SKY-D222]
