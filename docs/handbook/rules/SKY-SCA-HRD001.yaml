id: SKY-SCA-HRD001
title: Change weakens install hardening
family: supply-chain
severity: HIGH
languages: [.npmrc, package.json, pnpm-workspace.yaml, .yarnrc.yml, bunfig.toml, uv.toml, pyproject.toml, pip.conf, requirements*.txt, Dependabot, Renovate, GitHub Actions workflows]
gate:
  full: not_run
  diff: blocks
  note: >-
    In a diff scan one finding fails the gate on its own, whatever the
    limits. It only runs in diff scans.
run_with: >-
  `skylos . --sca --diff origin/main` on a pull request

what_it_is: >-
  Install hardening is the set of package-manager settings that make
  installs safer: blocking install scripts, waiting a few days before using
  a new release (a cooldown), and pinning CI actions to a commit.
  SKY-SCA-HRD001 reports a pull request that turns one of these off or
  makes it weaker.

why_it_matters: >-
  These settings stop most malicious releases before they run: an install
  script cannot run if scripts are blocked, and a cooldown keeps a hijacked
  version out until it has been found and removed. A one-line change to
  `.npmrc` in an unrelated pull request removes that protection for every
  developer and CI runner.

flagged_example:
  language: ini
  setup: git_diff
  expect_file: .npmrc
  expect_line: 1
  base_files:
    - filename: .npmrc
      code: |
        registry=https://registry.npmjs.org/
        ignore-scripts=true
    - filename: package.json
      language: json
      code: |
        {
          "name": "shop",
          "version": "1.0.0",
          "dependencies": {
            "ms": "2.1.3"
          }
        }
  files:
    - filename: .npmrc
      code: |
        registry=https://registry.npmjs.org/
        ignore-scripts=false

not_flagged_example:
  language: ini
  setup: git_diff
  base_files:
    - filename: .npmrc
      code: |
        registry=https://registry.npmjs.org/
        ignore-scripts=true
    - filename: package.json
      language: json
      code: |
        {
          "name": "shop",
          "version": "1.0.0",
          "dependencies": {
            "ms": "2.1.3"
          }
        }
  files:
    - filename: .npmrc
      code: |
        registry=https://registry.npmjs.org/
        ignore-scripts=true
        save-exact=true
  why: >-
    The pull request edits `.npmrc` too, but install scripts stay blocked.
    Adding `save-exact` changes how versions are written, not what may run.

more_examples:
  - flagged:
      language: toml
      setup: git_diff
      expect_file: pyproject.toml
      expect_line: 7
      base_files:
        - filename: pyproject.toml
          code: |
            [project]
            name = "worker"
            version = "1.0.0"
            dependencies = ["six==1.17.0"]

            [tool.uv]
            exclude-newer = "7 days"
      files:
        - filename: pyproject.toml
          code: |
            [project]
            name = "worker"
            version = "1.0.0"
            dependencies = ["six==1.17.0"]

            [tool.uv]
            exclude-newer = "1 day"
    not_flagged:
      language: toml
      setup: git_diff
      base_files:
        - filename: pyproject.toml
          code: |
            [project]
            name = "worker"
            version = "1.0.0"
            dependencies = ["six==1.17.0"]

            [tool.uv]
            exclude-newer = "7 days"
      files:
        - filename: pyproject.toml
          code: |
            [project]
            name = "worker"
            version = "1.0.0"
            dependencies = ["six==1.17.0"]

            [tool.uv]
            exclude-newer = "14 days"
      why: >-
        uv's `exclude-newer` cooldown changed, but it got longer: uv now
        ignores releases newer than 14 days instead of 7.

how_skylos_decides:
  - >-
    Runs with `--sca` in a diff scan (`--diff` or `--diff-base`). It takes
    the files Git tracks from both sides, the merge base and the working
    tree; untracked files never count.
  - >-
    When a hardening file changed (`.npmrc`, `package.json`,
    `pnpm-workspace.yaml`, `.yarnrc.yml`, `bunfig.toml`, `uv.toml`,
    `pyproject.toml`, `pip.conf`, requirements files, Dependabot and
    Renovate settings, or GitHub workflows and actions), the `ca9` library
    reads the settings of both sides and lists what got weaker.
  - >-
    Weaker means: install scripts allowed again (`ignore-scripts`, Bun
    `ignoreScripts`, Yarn `enableScripts`, pnpm `strictDepBuilds`); a
    package added to an allow list for build scripts; a cooldown lowered or
    removed (npm `min-release-age`, pnpm `minimumReleaseAge`, Yarn, Bun, uv
    `exclude-newer`, pip `uploaded-prior-to`, Dependabot, Renovate); a
    package excluded from a cooldown; and a CI action that was pinned to a
    commit and no longer is.
  - >-
    Each tool's units are respected, so pnpm minutes and npm days are not
    mixed up. A removed cooldown is not reported when the tool's own
    default is at least as long.
  - >-
    Skips a package listed in `[tool.skylos.supply_chain.hardening_exceptions]`
    with a reason, read from the base commit only, so a pull request cannot
    add its own exception. If `ca9` cannot compare the settings, the scan
    stops as incomplete instead of passing.

source_refs:
  - path: skylos/rules/sca/supply_chain_diff.py
    symbol: "def hardening_findings("
  - path: skylos/rules/sca/supply_chain_diff.py
    symbol: "def hardening_path("
    note: which changed files start the comparison.
  - path: skylos/rules/sca/supply_chain_diff.py
    symbol: "def base_hardening_exceptions("
  - path: skylos/core/gatekeeper.py
    symbol: "def supply_chain_change_blocks("
    note: one finding fails a diff gate.

fix:
  explanation: >-
    Keep the setting. If one package really needs its install script, allow
    that package by name (pnpm `allowBuilds`, Bun `trustedDependencies`)
    instead of turning scripts back on for everything, and record the
    reviewed exception on the base branch first, in its own pull request.
  language: ini
  filename: .npmrc
  code: |
    registry=https://registry.npmjs.org/
    ignore-scripts=true

false_alarms_and_suppression:
  misfires:
    - >-
      A cooldown written as an absolute date, such as uv
      `exclude-newer = "2026-01-01"`, is not compared, so moving the date
      forward is not reported.
    - >-
      Hardening that lives outside the repository, such as a developer's own
      `~/.npmrc` or a CI runner's environment variables, is not seen.
  suppress:
    - check: config
      text: >-
        `[tool.skylos] ignore = ["SKY-SCA-HRD001"]` turns the rule off. In
        pull-request CI the setting is read from the base branch, so it must
        be merged first.
    - text: >-
        For one package, add it with a reason under
        `[tool.skylos.supply_chain.hardening_exceptions]` on the base branch,
        for example `esbuild = "needs its postinstall to fetch the binary"`.

related: [SKY-SCA-UPG001, SKY-SCA-AGE001, SKY-SCA-SRC004]
