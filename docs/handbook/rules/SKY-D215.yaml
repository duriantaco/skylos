fix:
  explanation: >-
    Resolve the full path and check that it is still inside the base folder
    before using it. Reject everything else.
  filename: app/files.py
  code: |
    from pathlib import Path

    from flask import Flask, abort, request, send_file

    app = Flask(__name__)
    UPLOAD_DIR = Path("/srv/uploads").resolve()


    @app.get("/files")
    def download():
        name = request.args.get("name", "")
        path = (UPLOAD_DIR / name).resolve()
        if not path.is_relative_to(UPLOAD_DIR):
            abort(404)
        return send_file(path)

false_alarms_and_suppression:
  misfires:
    - >-
      A check made inside another function, such as `ensure_inside(path)`
      that calls `abort()`, is not seen: the path is still reported.
    - >-
      An allowlist kept in a lower-case variable (`if name not in
      reports: abort(404)`) is not recognised; use a literal set or an
      upper-case constant.
    - >-
      An `open()` that reads or writes the same path usually also gets
      SKY-D325 or SKY-D324, which ask about symlinks. They are separate
      findings.
  suppress:
    - check: inline
      text: >-
        Silence one line and say why. A bare `# noqa` does not hide HIGH
        security findings.
      language: python
      code: |
        return send_file(path)  # skylos: ignore[SKY-D215] path checked by ensure_inside()
    - check: baseline
      text: >-
        Accept the findings you already have with `skylos baseline .`, then
        scan with `--baseline` so only new ones are listed.
    - check: config
      text: >-
        `[tool.skylos] ignore = ["SKY-D215"]` turns the rule off for the
        whole project.

related: [SKY-D324, SKY-D325, SKY-D326, SKY-D255]
