fix:
  explanation: >-
    Move the inner search into its own function and use guard clauses
    (`continue`, early `return`) instead of nested `if` blocks.
  filename: app/invoices.py
  code: |
    """Match bank payments to open invoices."""


    def _match_invoice(payment, invoices, tolerance):
        for invoice in invoices:
            if invoice.paid or invoice.customer_id != payment.customer_id:
                continue
            if abs(invoice.amount - payment.amount) <= tolerance:
                invoice.paid = True
                return invoice
            if payment.reference and payment.reference in invoice.number:
                invoice.flag_partial(payment.amount)
                return None
        payment.mark_unmatched()
        return None


    def reconcile(payments, invoices, tolerance):
        matched = []
        for payment in payments:
            if payment.status != "settled":
                continue
            invoice = _match_invoice(payment, invoices, tolerance)
            if invoice is not None:
                matched.append((payment.id, invoice.id))
        return matched

false_alarms_and_suppression:
  misfires:
    - >-
      A function that is one large but regular state machine, such as a
      parser loop, can score high while being the clearest form for it.
    - >-
      Because nested function bodies count toward the outer function, a
      function that defines several callbacks inline is scored for all of
      them.
    - >-
      The limit of 15 cannot be changed; only ignoring the rule or a
      finding helps.
  suppress:
    - check: inline
      text: >-
        On the `def` line (the reported line):
      language: python
      code: |
        def reconcile(payments, invoices, tolerance):  # skylos: ignore[SKY-Q306] reviewed
    - check: config
      text: >-
        `[tool.skylos] ignore = ["SKY-Q306"]` turns the rule off for the
        project. A baseline accepts existing findings, but it records the
        absolute file path and the line, so an entry stops matching when the
        checkout moves or the line shifts.

related: [SKY-Q301, SKY-Q302, SKY-C304]
