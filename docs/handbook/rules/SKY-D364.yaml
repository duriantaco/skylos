fix:
  explanation: >-
    Register the workflow as a trusted publisher on PyPI (or npm), grant
    `id-token: write` to the publish job only, drop the `password` input and
    revoke the old token. Keep the `environment:` so a reviewer can require
    approval before each release.
  filename: .github/workflows/release.yml
  code: |
    name: Release
    on:
      release:
        types: [published]
    permissions:
      contents: read
    jobs:
      pypi:
        runs-on: ubuntu-latest
        environment: pypi
        permissions:
          id-token: write
        steps:
          - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
            with:
              persist-credentials: false
          - run: python -m pip install build==1.2.2 && python -m build
          - uses: pypa/gh-action-pypi-publish@76f52bc884231f62b9a034ebfe128415bbaabdfc

false_alarms_and_suppression:
  misfires:
    - >-
      A token kept on purpose as a fallback while trusted publishing is set
      up is reported until it is removed (LOW for npm in a job with
      `id-token: write`).
    - >-
      Uploads from a self-hosted runner to npm are not reported, because npm
      offers trusted publishing only to GitHub-hosted runners.
  suppress:
    - check: inline
      text: >-
        Put `# skylos: ignore[SKY-D364]` and a reason on the reported line or
        on the line directly above it, one rule per marker.
      language: yaml
      code: |
        with:
          # skylos: ignore[SKY-D364] trusted publisher pending, see #412
          password: ${{ secrets.PYPI_API_TOKEN }}
    - check: config
      text: >-
        `[tool.skylos] ignore = ["SKY-D364"]` turns the rule off for the whole
        project.

related: [SKY-D373, SKY-D299, SKY-D340, SKY-D310]
