id: SKY-D281
title: SQL injection in a Next.js Server Action
family: security
severity: CRITICAL
languages: [TypeScript/JavaScript]
gate:
  full: critical_blocks

what_it_is: >-
  A Next.js Server Action is a server function marked with `"use server"`
  that a form or a button in the browser can call directly. SKY-D281 reports
  a Server Action that pastes its input into the text of a SQL query, for
  example in a template literal passed to `pool.query()` or
  `prisma.$queryRawUnsafe()`.

why_it_matters: >-
  Every Server Action is a public endpoint: the browser sends its arguments
  and anyone can send other ones. A title such as `x' WHERE 1=1; --` turns
  an update of one row into an update of every row, and other inputs can read
  or delete whole tables.

flagged_example:
  language: typescript
  filename: app/posts/actions.ts
  expect_line: 10
  code: |
    "use server";

    import { revalidatePath } from "next/cache";

    import { pool } from "@/lib/db";

    export async function renamePost(formData: FormData) {
      const id = String(formData.get("id"));
      const title = String(formData.get("title"));
      await pool.query(`UPDATE posts SET title = '${title}' WHERE id = ${id}`);
      revalidatePath("/posts");
    }

not_flagged_example:
  language: typescript
  filename: app/posts/actions.ts
  code: |
    "use server";

    import { revalidatePath } from "next/cache";

    import { pool } from "@/lib/db";

    export async function renamePost(formData: FormData) {
      const id = String(formData.get("id"));
      const title = String(formData.get("title"));
      await pool.query("UPDATE posts SET title = $1 WHERE id = $2", [title, id]);
      revalidatePath("/posts");
    }
  why: >-
    The same action, but the SQL text is a fixed string with `$1` and `$2`
    placeholders, and the form values travel separately in the array. No
    input reaches the SQL text, so nothing is reported.

more_examples:
  - flagged:
      language: javascript
      filename: app/users/actions.js
      expect_line: 9
      code: |
        "use server";

        import { PrismaClient } from "@prisma/client";

        const prisma = new PrismaClient();

        export async function findUser(formData) {
          const email = String(formData.get("email") ?? "");
          return prisma.$queryRawUnsafe(`SELECT id, name FROM users WHERE email = '${email}'`);
        }
    not_flagged:
      language: javascript
      filename: app/users/actions.js
      code: |
        "use server";

        import { PrismaClient } from "@prisma/client";

        const prisma = new PrismaClient();

        export async function findUser(formData) {
          const email = String(formData.get("email") ?? "");
          return prisma.$queryRaw`SELECT id, name FROM users WHERE email = ${email}`;
        }
      why: >-
        It looks like the same template, but `$queryRaw` is a tagged template
        on a client made with `new PrismaClient()` from `@prisma/client`.
        Prisma turns each `${…}` into a bound parameter, so Skylos treats
        it as safe. `$queryRawUnsafe` with a template literal pastes the text
        in.

how_skylos_decides:
  - >-
    Runs with `--danger` on TypeScript and JavaScript files that contain
    `"use server"` and a call to `query`, `exec`, `execute`, `raw`, `sql`,
    `$queryRaw`, `$executeRaw` or their `Unsafe` forms.
  - >-
    Treats as Server Actions the exported functions of a file that starts
    with `"use server"`, and any function whose body starts with it. Every
    parameter of such a function is untrusted input.
  - >-
    Follows that input through variables, `String()`, `+`, template
    literals, local helper functions and callbacks inside the action.
  - >-
    Checks that the receiver is a database: a value imported from or made
    by a SQL library (`pg`, `mysql`, `@prisma/client`, `knex`,
    `drizzle-orm`, `sequelize`, `typeorm`, SQLite drivers and others), or a
    name such as `db`, `pool`, `conn`, `prisma` or `sql`. Loggers, `console`
    and regular expressions are skipped.
  - >-
    Skips query text that carries no input (fixed strings with
    placeholders, constants) and Prisma `$queryRaw` and `$executeRaw`
    tagged templates on a proven Prisma client.
  - >-
    Reports CRITICAL on the SQL text when the input reaches it and the text
    contains a SQL keyword, or is the input itself, or the method is
    `$queryRawUnsafe`, `$executeRawUnsafe`, `raw` or `unsafe`. The general
    SQL injection finding (SKY-D211) for the same call is dropped.

source_refs:
  - path: skylos/visitors/languages/typescript/danger.py
    symbol: "def _check_nextjs_server_action_sqli("
  - path: skylos/visitors/languages/typescript/danger.py
    symbol: "_SERVER_ACTION_SQL_METHODS = frozenset("
  - path: skylos/visitors/languages/typescript/danger.py
    symbol: "def _server_action_scopes("
  - path: skylos/visitors/languages/typescript/danger.py
    symbol: "def _receiver_has_sql_provenance(self, receiver) -> bool:"
  - path: skylos/visitors/languages/typescript/danger.py
    symbol: "def _is_proven_parameterizing_tag(self, call, method: str, receiver) -> bool:"
  - path: test/test_ts_danger_nextjs.py
    symbol: "class TestServerActionSQLi"

fix:
  explanation: >-
    Keep the SQL text fixed and pass each value as a parameter: `$1`, `$2`
    with an array for `pg`, `?` for MySQL and SQLite, or Prisma's
    `$queryRaw` tagged template. Check in the action that the caller may
    change the record, since Server Actions are public.
  filename: app/posts/actions.ts
  code: |
    "use server";

    import { revalidatePath } from "next/cache";

    import { pool } from "@/lib/db";

    export async function renamePost(formData: FormData) {
      const id = Number(formData.get("id"));
      const title = String(formData.get("title"));
      await pool.query("UPDATE posts SET title = $1 WHERE id = $2", [title, id]);
      revalidatePath("/posts");
    }

false_alarms_and_suppression:
  misfires:
    - >-
      A value checked against an allowlist before it is pasted in, such as a
      sort column, is still reported: the check does not recognise
      allowlists.
    - >-
      Missed: SQL built in a helper imported from another file, and query
      calls on a receiver whose name and origin do not look like a database.
      SQL in ordinary route files and other code is SKY-D211.
  suppress:
    - check: inline
      text: >-
        Mark the line with the SQL text and say why the value is safe.
      language: typescript
      code: |
        await db.query(`SELECT * FROM t ORDER BY ${col}`); // skylos: ignore[SKY-D281] allowlist
    - check: config
      text: >-
        `[tool.skylos] ignore = ["SKY-D281"]` turns the rule off for the whole
        project, which hides real injections too.
    - check: baseline
      text: >-
        `skylos baseline .` and then `--baseline` accept today's findings and
        report only new ones.

related: [SKY-D211, SKY-D280]
