id: SKY-D303
title: contains() used as an allow-list check
family: ci-cd
severity: MEDIUM
severity_note: >-
  The catalog lists MEDIUM, but the detector reports every finding as HIGH.
languages: [GitHub Actions workflows]
gate:
  full: counted

what_it_is: >-
  In a GitHub Actions expression, `contains('alice bob', github.actor)`
  with a text first argument is a substring test, not a list lookup. It is
  true for any value that appears anywhere inside the text. SKY-D303
  reports `contains()` used this way in a job or step `if:` on a value the
  person running the workflow can choose.

why_it_matters: >-
  A condition meant to let only `alice-dev` and `bob-ops` deploy also lets
  through accounts named `bob`, `b-op` or `ice-d`. Whoever registers such
  a name gets past the check and runs the job with its secrets.

flagged_example:
  language: yaml
  filename: .github/workflows/deploy.yml
  expect_line: 9
  code: |
    name: Deploy on command
    on:
      issue_comment:
        types: [created]
    permissions:
      contents: read
    jobs:
      deploy:
        if: contains('alice-dev bob-ops carol', github.actor)
        runs-on: ubuntu-latest
        environment: production
        steps:
          - run: ./scripts/deploy.sh
            env:
              DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}

not_flagged_example:
  language: yaml
  filename: .github/workflows/deploy.yml
  code: |
    name: Deploy on label
    on:
      pull_request_target:
        types: [labeled]
    permissions:
      contents: read
    jobs:
      deploy:
        if: contains(github.event.pull_request.labels.*.name, 'deploy')
        runs-on: ubuntu-latest
        environment: production
        steps:
          - run: ./scripts/deploy.sh
            env:
              DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
  why: >-
    Here the first argument is an array (the label names), so `contains()`
    looks for an exact element. Only accounts with triage or write access
    can add a label.

how_skylos_decides:
  - >-
    Reads the `if:` of every job and step in workflow files (not composite
    actions).
  - >-
    Looks for `contains('…', X)`: the first argument a quoted text, the
    second a plain context name.
  - >-
    Reports it when X is, or starts with, one of `env`, `inputs`,
    `github.actor`, `github.triggering_actor`, `github.ref`,
    `github.ref_name`, `github.head_ref`, `github.base_ref` or `github.sha`.
    It does not check which events start the workflow or what the
    condition is used for.
  - >-
    One HIGH finding per condition and context, on the first line of the
    file that holds the condition's first line.

source_refs:
  - path: skylos/rules/config/cicd/github_actions.py
    symbol: "def _scan_conditions("
  - path: skylos/rules/config/cicd/github_actions.py
    symbol: "USER_CONTROLLED_CONTAINS_CONTEXTS = {"
  - path: test/test_github_actions_security.py
    symbol: "def test_github_actions_scanner_detects_extended_offline_risks("

fix:
  explanation: >-
    Turn the list into a real array with `fromJSON`, so `contains()` checks
    for an exact element. Comparing with `==` for each name works too.
  filename: .github/workflows/deploy.yml
  code: |
    name: Deploy on command
    on:
      issue_comment:
        types: [created]
    permissions:
      contents: read
    jobs:
      deploy:
        if: contains(fromJSON('["alice-dev", "bob-ops", "carol"]'), github.actor)
        runs-on: ubuntu-latest
        environment: production
        steps:
          - run: ./scripts/deploy.sh
            env:
              DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}

false_alarms_and_suppression:
  misfires:
    - >-
      A substring test that is meant as one, such as
      `contains('refs/heads/main refs/heads/develop', github.ref)` in a
      push-only workflow, is reported even though only people with write
      access can push a branch.
    - >-
      A condition written over several lines (`if: >-`) is found, but its
      line is looked up by the whole folded text, which is not in the file,
      so the finding is placed on line 1.
  suppress:
    - check: inline
      text: >-
        Put `# skylos: ignore[SKY-D303]` on the reported line or on the line
        directly above it, one rule per marker.
      language: yaml
      code: |
        # skylos: ignore[SKY-D303] push-only workflow, only writers push
        if: contains('refs/heads/main refs/heads/develop', github.ref)
    - check: config
      text: >-
        `[tool.skylos] ignore = ["SKY-D303"]` turns the rule off for the whole
        project.
    - check: baseline
      text: >-
        A baseline works, but it records the absolute file path and the line,
        so it stops matching when the checkout moves or lines above shift.

related: [SKY-D304, SKY-D305, SKY-D350]
