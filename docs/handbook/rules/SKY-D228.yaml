fix:
  explanation: >-
    Escape the value for the place it lands, or render it with a template
    engine that escapes by default (Jinja, `html/template`, React). In
    Python, `html.escape()` covers element text and quoted attributes; in Go
    use `html.EscapeString`; in PHP `htmlspecialchars($v, ENT_QUOTES)`.
  filename: app/greet.py
  code: |
    import html

    from flask import Flask, request

    app = Flask(__name__)


    @app.get("/hello")
    def hello():
        name = request.args.get("name", "")
        return f"<h1>Hello, {html.escape(name)}!</h1>"

false_alarms_and_suppression:
  misfires:
    - >-
      In Python every function parameter counts as user data, so a helper
      such as `def badge(label): return f"<b>{label}</b>"` is reported even
      when every caller passes a constant.
    - >-
      A value escaped by a helper Skylos cannot see into (another module, or
      a sanitizer it does not know) is reported.
    - >-
      Python only checks `return` values. HTML assigned to a variable and
      passed to a response object, or plain text with no tag that Flask
      still serves as HTML, is not reported.
  suppress:
    - check: inline
      text: >-
        Mark the reported line and say why the value is safe.
      language: python
      code: |
        return f"<b>{label}</b>"  # skylos: ignore[SKY-D228] label is a fixed enum value
    - check: baseline
      text: >-
        Accept existing findings with `skylos baseline .`, then scan with
        `--baseline`. Entries match by file and line, so they stop matching
        when the line moves.
    - check: config
      text: >-
        `[tool.skylos] ignore = ["SKY-D228"]` turns the rule off for the
        whole project.

related: [SKY-D226, SKY-D227, SKY-D230]
