fix:
  explanation: >-
    Find the real package that does the job and use its documented API, or
    write the helper yourself. Never `pip install` or `npm install` an
    unknown name to make the error go away: if someone has registered it,
    that runs their code.
  language: python
  code: |
    import os

    import stripe
    from flask import Flask, abort, request

    app = Flask(__name__)
    WEBHOOK_SECRET = os.environ["STRIPE_WEBHOOK_SECRET"]


    @app.post("/webhooks/stripe")
    def stripe_webhook():
        signature = request.headers.get("Stripe-Signature", "")
        try:
            event = stripe.Webhook.construct_event(
                request.data, signature, WEBHOOK_SECRET
            )
        except (ValueError, stripe.error.SignatureVerificationError):
            abort(400)
        return {"received": event["id"]}

false_alarms_and_suppression:
  misfires:
    - >-
      A private package installed from your own index is reported when the
      manifest does not say so. Name the index in the manifest
      (`--index-url` in `requirements.txt`, an `.npmrc` registry), or list
      the names in `SKYLOS_PRIVATE_DEPS_ALLOW`, comma-separated.
    - >-
      An import name that differs from its distribution name, used by a
      package that is neither installed nor declared, can be reported when
      no PyPI project has the import name. Declaring the distribution in the
      manifest settles it.
    - >-
      A package of your own repository that is not published, listed with
      a version in `pyproject.toml` (`"acme-billing-core==2.4.0"`), is
      reported unless a local source names it, for example
      `[tool.uv.sources]` with `workspace = true` or a `path`.
    - >-
      Without network access the registry check cannot answer and nothing
      is reported, so an offline scan finds no hallucinated packages.
  suppress:
    - text: >-
        On the Python import line, with the reason the package is real:
      language: python
      code: |
        from stripe_webhook_guard import verify_event  # skylos: ignore[SKY-D222] internal index
    - text: >-
        `[tool.skylos] ignore = ["SKY-D222"]` turns the rule off for the
        project.

related: [SKY-D225, SKY-D223, SKY-D224, SKY-A106]
