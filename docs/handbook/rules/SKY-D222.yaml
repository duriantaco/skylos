id: SKY-D222
title: Dependency hallucination
family: ai-defects
severity: CRITICAL
severity_note: >-
  CRITICAL when the package does not exist in its registry. HIGH when it
  exists but its name is one letter away from a popular package, such as
  `reqeusts` for `requests` (a possible typosquat).
languages: [Python, JavaScript/TypeScript (npm), Go modules, install commands in scripts, Dockerfiles, CI files and docs]
gate:
  full: critical_blocks
  note: >-
    Counts toward `max_ai_defects`. A CRITICAL finding fails the gate on its
    own while `block_ai_defect_severities` (under `[tool.skylos.gate]`)
    keeps its default `["CRITICAL"]`; the HIGH look-alike finding only
    counts. The agent hook (`skylos verify`) blocks on it. `skylos done`
    lists it as advice unless `unknown_imports = "block"` is set under
    `[tool.skylos.done.checks]`.
run_with: >-
  `skylos . --ai-defects` (or `-a`) with network access to PyPI, the npm
  registry and the Go module proxy

what_it_is: >-
  A hallucinated dependency is a package the code imports or a manifest
  lists that does not exist in the package registry, because a coding agent
  invented a plausible name. SKY-D222 checks Python imports against PyPI,
  and the entries of `requirements.txt`, `pyproject.toml`, `package.json`
  and `go.mod`, plus `pip install`, `npm install` and `go get` commands,
  against PyPI, npm and the Go module proxy.

why_it_matters: >-
  The install fails at best. At worst someone registers the invented name
  first ("slopsquatting"), and the next `pip install` runs their code on
  your laptop or in CI with your credentials. Attackers watch for the names
  agents tend to invent.

verify:
  mode: manual
  reason: >-
    needs PyPI, the npm registry and the Go module proxy, so one offline
    scan cannot reproduce it; examples checked by hand online with Skylos
    5.6.0

flagged_example:
  language: python
  filename: app/webhooks.py
  expect_line: 4
  code: |
    import os

    from flask import Flask, abort, request
    from stripe_webhook_guard import verify_event

    app = Flask(__name__)
    WEBHOOK_SECRET = os.environ["STRIPE_WEBHOOK_SECRET"]


    @app.post("/webhooks/stripe")
    def stripe_webhook():
        event = verify_event(request.data, request.headers, WEBHOOK_SECRET)
        if event is None:
            abort(400)
        return {"received": event["id"]}

not_flagged_example:
  language: python
  files:
    - filename: app/webhooks.py
      code: |
        import os

        from flask import Flask, abort, request
        from stripe_webhook_guard import verify_event

        app = Flask(__name__)
        WEBHOOK_SECRET = os.environ["STRIPE_WEBHOOK_SECRET"]


        @app.post("/webhooks/stripe")
        def stripe_webhook():
            event = verify_event(request.data, request.headers, WEBHOOK_SECRET)
            if event is None:
                abort(400)
            return {"received": event["id"]}
    - filename: stripe_webhook_guard.py
      code: |
        """Our own wrapper around Stripe's webhook signature check."""

        import stripe


        def verify_event(payload, headers, secret):
            signature = headers.get("Stripe-Signature", "")
            try:
                return stripe.Webhook.construct_event(payload, signature, secret)
            except (ValueError, stripe.error.SignatureVerificationError):
                return None
  why: >-
    The same import is fine here because the project ships
    `stripe_webhook_guard.py` itself. Skylos resolves local modules first
    and asks PyPI only about names that are not part of the project, the
    standard library or an installed package.

more_examples:
  - flagged:
      language: json
      filename: package.json
      expect_line: 7
      code: |
        {
          "name": "checkout-api",
          "version": "1.0.0",
          "private": true,
          "dependencies": {
            "express": "4.21.2",
            "express-csrf-shield": "2.1.0"
          }
        }
    not_flagged:
      language: json
      filename: package.json
      code: |
        {
          "name": "checkout-api",
          "version": "1.0.0",
          "private": true,
          "dependencies": {
            "express": "4.21.2",
            "express-rate-limit": "7.4.0"
          }
        }
      why: >-
        `express-rate-limit` is a real npm package, so the registry answers
        and nothing is reported. `express-csrf-shield` in the flagged
        version has no entry in the npm registry at all.

how_skylos_decides:
  - >-
    Python imports: for each top-level module a file imports, skips the
    standard library, the project's own modules and folders, names an
    installed or declared distribution provides (it reads installed
    metadata and, for declared packages, the file list of their wheels on
    PyPI), and imports inside `try`/`except ImportError` that have a
    fallback.
  - >-
    For a name left over, asks `https://pypi.org/simple/<name>/` (also with
    `_` turned into `-`). A 404 for a name longer than two characters and
    not all capitals is reported as CRITICAL on the import line. If a
    declared distribution could not be inspected, the import is reported as
    a possible hallucination under SKY-D223 instead. Names in the
    `SKYLOS_PRIVATE_DEPS_ALLOW` environment variable are skipped.
  - >-
    Manifests and install commands: reads `requirements.txt`,
    `pyproject.toml`, `package.json`, `go.mod` and other manifests up to
    three folders deep, plus `pip install name==1.0`, `npm install name@1.0`
    and `go get` lines in shell scripts, Dockerfiles, `.github/workflows`
    files and shell blocks in Markdown. Only entries with a version
    (`==`, `~=`, `>=` or an npm or Go version) are checked, and only PyPI,
    npm and Go packages have a registry check.
  - >-
    Asks the PyPI JSON API, the npm registry or the Go module proxy for the
    package and version. Package missing: CRITICAL. Package present but its
    name is one edit away from a popular package (`flask`, `requests`,
    `express`, `lodash` and others): HIGH. Version missing: SKY-D225.
  - >-
    Skips entries the registry cannot answer (network error, timeout),
    manifests that use a private index (`--index-url`, `--extra-index-url`,
    a `[[tool.poetry.source]]`, an `.npmrc` registry, `PIP_INDEX_URL=`), and
    ecosystems without a checker. Answers are cached in
    `.skylos/cache/dependency_versions.json`.

