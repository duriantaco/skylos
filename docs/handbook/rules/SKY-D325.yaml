id: SKY-D325
title: Symlink-following file read
family: security
severity: MEDIUM
languages: [Python]
gate:
  full: counted
cwe: [CWE-59]

what_it_is: >-
  A symbolic link (symlink) is a file that points to another path; reading
  it reads the target. SKY-D325 reports a file read whose path is built
  from outside input when the exact operation lacks established protection
  against following links or consuming unbounded contents.

why_it_matters: >-
  If someone can leave a link named `report.csv` in the export folder, a
  download endpoint that serves `report.csv` hands out `/etc/shadow`, a
  private key or the app's `.env`. A path such as `/dev/zero` or a huge file
  read without a size cap can also exhaust the server's memory.

flagged_example:
  language: python
  filename: app/exports.py
  expect_line: 12
  code: |
    from pathlib import Path

    from flask import Flask, request

    app = Flask(__name__)
    EXPORTS_DIR = Path("/srv/app/exports")


    @app.get("/exports")
    def download_export():
        name = Path(request.args["file"]).name
        data = (EXPORTS_DIR / name).read_bytes()
        return data, 200, {"Content-Type": "text/csv"}

not_flagged_example:
  language: python
  filename: app/show_export.py
  code: |
    from pathlib import Path

    import click


    @click.command()
    @click.argument("export_file")
    def show_export(export_file):
        """Print an export file to the terminal."""
        click.echo(Path(export_file).read_text())


    if __name__ == "__main__":
        show_export()
  why: >-
    The path is an argument of a Click command, so it comes from the person
    running the program, who can already read any file they choose. Skylos
    traces Click and Typer arguments, `sys.argv` and environment variables
    in their process contexts. This standalone command has no modeled
    launcher supplying an untrusted value.

how_skylos_decides:
  - >-
    Looks at Python reads: `open()` and a path's `.open()` in a read mode
    (`r`; a `+` mode when the handle is seen being read; a mode it cannot
    read), `Path.read_text()` and `read_bytes()`, and read-only `os.open()`.
    Observed descriptor reads also count after a read/write open or exclusive
    create. Unknown or rebound flags retain both read and write checks.
  - >-
    The path must be able to carry outside data: a tainted value (a
    function parameter, `request.*`, `input()`, `os.getenv()`), a string
    built with an f-string, `+`, `%` or `.format()`, or a name taken from
    such a value with `Path(x).name`. A base name joined to a fixed folder
    is still reported: the last part can be a link.
  - >-
    Recognizes exclusive creates only with native operation and mode or flag
    proof. A no-follow flag must be the native value passed to that exact
    open operation; mentioning it or using a fallback of zero proves nothing.
  - >-
    Skips a proven read-only `os.open()` with the native `O_DIRECTORY`
    flag: it opens a directory descriptor, not file contents. SKY-D215
    still checks its path. Unknown flags and a fallback such as
    `getattr(os, "O_DIRECTORY", 0)` do not prove this exception.
  - >-
    A native no-follow descriptor also needs proven finite reads through
    that same descriptor or its own native file handle. Unknown sizes,
    mutable bindings, escaped or replaced descriptors, and repeated reads
    that can accumulate unbounded contents do not establish this proof.
  - >-
    A bare mention of `is_file`, `fstat`, containment or a size-related name
    does not certify a read. Checks on another path, ignored checks and
    prechecks that can race with the open do not establish atomic safety.
  - >-
    Decides who controls the path as SKY-D324 does: request data and route
    or MCP tool arguments are reported. Operator and helper inputs are traced
    in their possible process contexts. Only proven-safe candidates move to
    `suppressed`; unresolved or incomplete sources stay visible. Reports MEDIUM on
    the line of the read call.
  - >-
    Caller provenance does not establish an attacker's ability to create or
    replace a symlink. The finding states that prerequisite separately from
    the read-size concern; deployment permissions still need review.

