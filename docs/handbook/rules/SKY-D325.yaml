fix:
  explanation: >-
    Open the file with `O_NOFOLLOW` so a link in the last part makes the
    call fail, check with `fstat` that it is a regular file, and read at
    most a fixed number of bytes.
  filename: app/exports.py
  code: |
    import os
    import stat
    from pathlib import Path

    from flask import Flask, abort, request

    app = Flask(__name__)
    EXPORTS_DIR = Path("/srv/app/exports")
    MAX_EXPORT_BYTES = 10 * 1024 * 1024


    @app.get("/exports")
    def download_export():
        name = Path(request.args["file"]).name
        fd = os.open(EXPORTS_DIR / name, os.O_RDONLY | os.O_NOFOLLOW)
        with os.fdopen(fd, "rb") as fh:
            if not stat.S_ISREG(os.fstat(fh.fileno()).st_mode):
                abort(404)
            data = fh.read(MAX_EXPORT_BYTES)
        return data, 200, {"Content-Type": "text/csv"}

false_alarms_and_suppression:
  misfires:
    - >-
      A read inside a folder only your own process writes to cannot be
      redirected, but Skylos cannot see who writes the folder.
    - >-
      The guard is found by name, so it can also hide a real problem: an
      earlier `path.is_file()`, which follows links, is enough to silence
      the rule, and so is a bare `.resolve()` together with a size check.
    - >-
      `O_NOFOLLOW` kept in a module constant is not seen inside the
      function. Write it in the call or in a local variable.
  suppress:
    - check: inline
      text: >-
        Silence one reviewed read on its reported line and say why.
      language: python
      code: |
        data = path.read_bytes()  # skylos: ignore[SKY-D325] folder written only by us
    - check: baseline
      text: >-
        Accept the reads you already have with `skylos baseline .`, then scan
        with `--baseline` so only new ones are listed.
    - check: config
      text: >-
        `[tool.skylos] ignore = ["SKY-D325"]` turns the rule off for the
        whole project.

related: [SKY-D324, SKY-D215, SKY-D326]
