fix:
  explanation: >-
    Ship and load weights in the safetensors format, which holds only
    tensor data and runs no code. When you must read a PyTorch checkpoint,
    pass `weights_only=True` and keep PyTorch at 2.6 or later: earlier
    versions had a bypass of that option (CVE-2025-32434). Load joblib,
    pickle and Keras files only from storage you control.
  filename: app/classifier.py
  code: |
    from huggingface_hub import hf_hub_download
    from safetensors.torch import load_file

    REPO_ID = "acme-labs/ticket-classifier"
    REVISION = "9b1c2d3e4f5a6b7c8d9e0f1a2b3c4d5e6f7a8b9c"


    def load_classifier(net):
        weights = hf_hub_download(REPO_ID, "classifier.safetensors", revision=REVISION)
        net.load_state_dict(load_file(weights))
        return net.eval()

false_alarms_and_suppression:
  misfires:
    - >-
      A helper such as `def load(path): return torch.load(path)` is CRITICAL,
      because function parameters count as untrusted, even when every caller
      passes a file you built yourself.
    - >-
      PyTorch 2.6 and later already default to `weights_only=True`, but
      Skylos cannot see the installed version and asks for the keyword.
      Keras `load_model()` is reported for every file format and whatever
      its `safe_mode=` setting.
    - >-
      `weights_only=True` is trusted as written; Skylos does not check that
      the installed PyTorch has the fix for CVE-2025-32434.
  suppress:
    - check: inline
      text: >-
        Silence one call that reads only your own artefacts and say why. A
        bare `# noqa` does not hide a HIGH or CRITICAL security finding.
      language: python
      code: |
        model = joblib.load(MODEL_PATH)  # skylos: ignore[SKY-D265] built by our CI job
    - check: baseline
      text: >-
        Accept the loaders you already have with `skylos baseline .`, then
        scan with `--baseline` so only new ones are listed.
    - check: config
      text: >-
        `[tool.skylos] ignore = ["SKY-D265"]` turns the rule off for the
        whole project. It does not hide SKY-D204 or SKY-D205 on the same
        `pickle` calls.

related: [SKY-D204, SKY-D205, SKY-D233, SKY-D213, SKY-D345]
