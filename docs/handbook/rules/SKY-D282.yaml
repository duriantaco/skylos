id: SKY-D282
title: Webhook handler trusts events without checking the signature
family: security
severity: HIGH
languages: [Python, TypeScript/JavaScript]
gate:
  full: counted
cwe: [CWE-347]

what_it_is: >-
  A webhook is a URL that a service such as Stripe, GitHub or Slack calls to
  tell your app that something happened, for example "this invoice was
  paid". The service signs each call with a shared secret. SKY-D282 reports
  a webhook handler that reads the event body without checking that
  signature first.

why_it_matters: >-
  The webhook URL is public. Without the signature check, anyone can post a
  made-up "payment succeeded" event and get an order marked as paid, or fake
  a GitHub push to start a deployment.

flagged_example:
  language: python
  filename: app/webhooks.py
  expect_line: 9
  code: |
    from flask import Flask, request

    from app.billing import mark_paid

    app = Flask(__name__)


    @app.post("/stripe/webhook")
    def stripe_webhook():
        event = request.get_json()
        if event["type"] == "checkout.session.completed":
            mark_paid(event["data"]["object"]["client_reference_id"])
        return "", 200

not_flagged_example:
  language: python
  filename: app/webhooks.py
  code: |
    import os

    import stripe
    from flask import Flask, abort, request

    from app.billing import mark_paid

    app = Flask(__name__)
    ENDPOINT_SECRET = os.environ["STRIPE_WEBHOOK_SECRET"]


    @app.post("/stripe/webhook")
    def stripe_webhook():
        signature = request.headers.get("Stripe-Signature", "")
        try:
            event = stripe.Webhook.construct_event(request.data, signature, ENDPOINT_SECRET)
        except (ValueError, stripe.error.SignatureVerificationError):
            abort(400)
        if event["type"] == "checkout.session.completed":
            mark_paid(event["data"]["object"]["client_reference_id"])
        return "", 200
  why: >-
    The same Stripe route, but `stripe.Webhook.construct_event()` checks the
    raw body against the `Stripe-Signature` header and the secret, and a bad
    signature ends the request with 400 before the event is used.

more_examples:
  - flagged:
      language: typescript
      filename: app/api/stripe/webhook/route.ts
      expect_line: 5
      code: |
        import { NextResponse } from "next/server";

        import { markPaid } from "@/lib/billing";

        export async function POST(request: Request) {
          const event = await request.json();
          if (event.type === "checkout.session.completed") {
            await markPaid(event.data.object.client_reference_id);
          }
          return NextResponse.json({ received: true });
        }
    not_flagged:
      language: typescript
      filename: app/api/stripe/webhook/route.ts
      code: |
        import { NextResponse } from "next/server";
        import Stripe from "stripe";

        import { markPaid } from "@/lib/billing";

        const stripe = new Stripe(process.env.STRIPE_SECRET_KEY!);

        export async function POST(request: Request) {
          const body = await request.text();
          const signature = request.headers.get("stripe-signature");
          let event;
          try {
            event = stripe.webhooks.constructEvent(
              body,
              signature,
              process.env.STRIPE_WEBHOOK_SECRET,
            );
          } catch {
            return NextResponse.json({ error: "Bad signature" }, { status: 400 });
          }
          if (event.type === "checkout.session.completed") {
            await markPaid(event.data.object.client_reference_id);
          }
          return NextResponse.json({ received: true });
        }
      why: >-
        `constructEvent` comes from the real `stripe` package, receives the
        raw text body and the request's signature header, and a failure
        returns 400 before `event` is used.

how_skylos_decides:
  - >-
    Runs with `--danger`. Python files in `test`, `tests`, `fixture` or
    `fixtures` folders, `test_*.py` and `*_test.py` are skipped.
  - >-
    Python: looks at each function. The file path, function name, route
    path or code must contain `webhook` and name a provider (`stripe`,
    `github`, `clerk`, `svix`, `shopify`, `supabase`, `resend`, `twilio`,
    `slack`, `discord`, `linear`, `vercel`, `netlify`, `paddle`,
    `lemonsqueezy`).
  - >-
    Python: the function must handle `POST` (a `.post()` decorator,
    `route(..., methods=["POST"])` or a `request.method == "POST"` test)
    and read the body (`request.get_json`, `request.json`, `request.data`,
    `request.body`). It is reported unless its code contains a check such
    as `construct_event(`, `verify_signature(`, `verify_webhook(`,
    `validate_signature(`, `hmac.compare_digest(`, `hmac.new(` or a
    `Webhook(...)` object's `.verify(`. This is a text match.
  - >-
    TypeScript and JavaScript: finds `POST` routes (Next.js route files,
    Express, Fastify, Hono) whose path names a webhook and a provider, or a
    provider event path in a file that imports `stripe`, `svix`,
    `@octokit/webhooks` or `crypto`, and that read the request body.
  - >-
    TypeScript and JavaScript are stricter: the route is safe only when a
    verifier from the real package (Stripe `constructEvent`, svix
    `Webhook.verify`, Octokit `verify`) or a `crypto.timingSafeEqual` HMAC
    check gets the raw body and the request's signature before the body is
    used, and a failure stops the request.

