fix:
  explanation: >-
    Verify the signature on the raw request body with the provider's
    library, using the webhook secret from the environment, and reject the
    request when the check fails. Only then parse the event and act on it.
  filename: app/webhooks.py
  code: |
    import os

    import stripe
    from flask import Flask, abort, request

    from app.billing import mark_paid

    app = Flask(__name__)
    ENDPOINT_SECRET = os.environ["STRIPE_WEBHOOK_SECRET"]


    @app.post("/stripe/webhook")
    def stripe_webhook():
        signature = request.headers.get("Stripe-Signature", "")
        try:
            event = stripe.Webhook.construct_event(request.data, signature, ENDPOINT_SECRET)
        except (ValueError, stripe.error.SignatureVerificationError):
            abort(400)
        if event["type"] == "checkout.session.completed":
            mark_paid(event["data"]["object"]["client_reference_id"])
        return "", 200

false_alarms_and_suppression:
  misfires:
    - >-
      Python: verification done in a helper whose name is not in the list
      (for example `check_stripe_event(request)`) is not seen, so the handler
      is reported.
    - >-
      Python: missed when the handler only mentions a check, for example
      `hmac.new(...)` whose result is compared with `==` or never compared,
      and when the body is read with `request.get_data()`.
    - >-
      TypeScript: a check written differently from the forms above is
      reported. Passing `process.env.STRIPE_WEBHOOK_SECRET ?? ""` as the
      secret is one case: the empty fallback is not accepted as a secret.
  suppress:
    - check: inline
      text: >-
        Mark the line of the finding (the `def` line in Python, the route
        line in TypeScript) and name what verifies the call.
      language: python
      code: |
        def stripe_webhook():  # skylos: ignore[SKY-D282] verified by StripeGuard middleware
    - check: config
      text: >-
        `[tool.skylos] ignore = ["SKY-D282"]` turns the rule off for the
        whole project.
    - check: baseline
      text: >-
        `skylos baseline .` and then `--baseline` accept the handlers you
        have and report only new ones.

related: [SKY-D232, SKY-D253, SKY-D280]
