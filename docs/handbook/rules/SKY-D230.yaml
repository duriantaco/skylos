fix:
  explanation: >-
    Only redirect to places you chose. Compare the value with a literal list
    of allowed paths, build the target with `url_for()` or `reverse()`, or in
    Django check it with `url_has_allowed_host_and_scheme()`. A
    `startswith("/")` test is not enough: `//evil.example` starts with a
    slash and leaves the site.
  filename: app/auth.py
  code: |
    from flask import Flask, redirect, request, session

    app = Flask(__name__)


    @app.post("/login")
    def login():
        session["user"] = request.form["user"]
        next_url = request.args.get("next", "/")
        if next_url not in {"/", "/account", "/orders"}:
            next_url = "/"
        return redirect(next_url)

false_alarms_and_suppression:
  misfires:
    - >-
      In Python, an allowlist kept in a named constant, such as
      `if next_url not in ALLOWED_PAGES:`, is not recognised; only a list,
      tuple or set written in the test counts.
    - >-
      A Python helper such as `def back_to(page): return redirect(page)` is
      reported, because function parameters count as user data for
      `redirect()`.
    - >-
      In TypeScript and JavaScript, `res.redirect(settings.homeUrl)` is
      reported even when the value comes from your own configuration: the
      syntactic check does not look for request data.
  suppress:
    - check: inline
      text: >-
        Mark the reported line and say why the target is safe.
      language: python
      code: |
        return redirect(page)  # skylos: ignore[SKY-D230] page is one of our route names
    - check: baseline
      text: >-
        Accept existing findings with `skylos baseline .`, then scan with
        `--baseline`. Entries match by file and line.
    - check: config
      text: >-
        `[tool.skylos] ignore = ["SKY-D230"]` turns the rule off for the
        whole project.

related: [SKY-D216, SKY-D226, SKY-D228]
