id = "mb-c3-clean-subprocess"
base = "microblog"
language = "python"
clean = true
story = "Control: the agent replaces os.system string commands in the translation CLI with subprocess.run argument lists (no shell). No seeded defect; the change removes a shell-string pattern."

[[edits]]
file = "app/cli.py"
old = '''
import os
from flask import Blueprint
import click
'''
new = '''
import os
import subprocess
from flask import Blueprint
import click


def _pybabel(*args):
    if subprocess.run(['pybabel', *args], check=False).returncode != 0:
        raise RuntimeError(f'pybabel {args[0]} failed')
'''

