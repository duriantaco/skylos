mode = "overwrite"
new = '''
import getTags from '../../app/routes/tag/tag.service';
import prismaMock from '../prisma-mock';

describe('TagService', () => {
  test('returns tag names in the order prisma returns them', async () => {
    // @ts-ignore
    prismaMock.tag.findMany.mockResolvedValue([{ name: 'a' }, { name: 'b' }]);
    await expect(getTags()).resolves.toEqual(['a', 'b']);
  });
});
