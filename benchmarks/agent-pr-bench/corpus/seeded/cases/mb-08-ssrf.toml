mode = "append"
new = '''


@bp.route('/link_preview')
@login_required
def link_preview():
    url = request.args.get('url', '')
    resp = requests.get(url)
    title = ''
    if '<title>' in resp.text:
        title = resp.text.split('<title>', 1)[1].split('</title>', 1)[0]
    return {'url': url, 'title': title}
'''

