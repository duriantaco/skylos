@bp.route('/api/posts/recent')
@login_required
def recent_posts():
    limit = min(request.args.get('limit', 10, type=int), 50)
    query = sa.select(Post).order_by(Post.timestamp.desc()).limit(limit)
    posts = db.session.scalars(query).all()
    return [{'id': p.id, 'body': p.body, 'author': p.author.username,
             'timestamp': p.timestamp.isoformat()} for p in posts]
