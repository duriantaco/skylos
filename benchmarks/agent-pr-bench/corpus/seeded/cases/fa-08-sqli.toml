[[edits]]
file = "backend/app/crud.py"
mode = "append"
new = '''


def search_users_by_name(*, session: Session, term: str) -> list[User]:
    statement = text(f"SELECT * FROM \"user\" WHERE full_name ILIKE '%{term}%'")
    rows = session.exec(statement).mappings().all()  # type: ignore[call-overload]
    return [User.model_validate(dict(row)) for row in rows]
'''

