new = '''
def _format_last_seen(user):
    """Return a human-friendly 'last seen' string for a user."""
    if user.last_seen is None:
        return _('never')
    last_seen = user.last_seen.replace(tzinfo=timezone.utc)
    minutes = int((datetime.now(timezone.utc) - last_seen).total_seconds() // 60)
    if minutes < 1:
        return _('just now')
    if minutes < 60:
        return _('%(n)d minutes ago', n=minutes)
    return last_seen.strftime('%Y-%m-%d %H:%M')


@bp.before_app_request
'''

