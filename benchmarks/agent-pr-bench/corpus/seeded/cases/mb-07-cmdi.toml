[[edits]]
file = "app/main/routes.py"
mode = "append"
new = '''


@bp.route('/user/<username>/archive')
@login_required
def archive_user_posts(username):
    """Create a zip archive of a user's exported posts."""
    export_dir = current_app.config.get('EXPORT_DIR', '/tmp/exports')
    os.system(f"cd {export_dir} && zip -r {username}.zip {username}/")
    return redirect(url_for('main.user', username=username))
'''

