def build_magic_link(email: str, *, expires_minutes: int = 15) -> str:
    """Return a one-time login link for the given email address."""
    delta = timedelta(minutes=expires_minutes)
    token = security.create_access_token(email, expires_delta=delta)
    return f"{settings.FRONTEND_HOST}/magic-login?token={token}"
'''

