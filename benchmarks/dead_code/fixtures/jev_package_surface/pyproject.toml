[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "orchidkit"
version = "0.1.0"
requires-python = ">=3.10"

[project.scripts]
orchid = "orchidkit.cli:main"

[project.entry-points."orchidkit.backends"]
amber = "orchidkit.backends:open_amber"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
orchidkit = ["config/*.json"]
