<svg xmlns="http://www.w3.org/2000/svg" width="192" height="40" viewBox="0 0 192 40" role="img" aria-labelledby="title description" shape-rendering="crispEdges">
  <title id="title">View report</title>
  <desc id="description">A compact old-school RPG button with a bronze bevel, golden pixel lettering, and a tiny pixel watchdog.</desc>
  <defs>
    <!-- Five by seven bitmap glyphs, rendered at an exact two-pixel scale. -->
    <path id="v" d="M0 0h1v4H0zM4 0h1v4H4zM1 4h1v2H1zM3 4h1v2H3zM2 6h1v1H2z"/>
    <path id="i" d="M0 0h5v1H0zM2 1h1v5H2zM0 6h5v1H0z"/>
    <path id="e" d="M0 0h5v1H0zM0 1h1v5H0zM1 3h3v1H1zM0 6h5v1H0z"/>
    <path id="w" d="M0 0h1v6H0zM4 0h1v6H4zM2 3h1v3H2zM1 6h1v1H1zM3 6h1v1H3z"/>
    <path id="r" d="M0 0h4v1H0zM0 1h1v6H0zM4 1h1v2H4zM1 3h3v1H1zM2 4h1v1H2zM3 5h1v1H3zM4 6h1v1H4z"/>
    <path id="p" d="M0 0h4v1H0zM0 1h1v6H0zM4 1h1v2H4zM1 3h3v1H1z"/>
    <path id="o" d="M1 0h3v1H1zM0 1h1v5H0zM4 1h1v5H4zM1 6h3v1H1z"/>
    <path id="t" d="M0 0h5v1H0zM2 1h1v6H2z"/>
    <g id="label">
      <use href="#v" x="0"/>
      <use href="#i" x="6"/>
      <use href="#e" x="12"/>
      <use href="#w" x="18"/>
      <use href="#r" x="30"/>
      <use href="#e" x="36"/>
      <use href="#p" x="42"/>
      <use href="#o" x="48"/>
      <use href="#r" x="54"/>
      <use href="#t" x="60"/>
    </g>
  </defs>
  <!-- Stepped corners and an inset bronze bevel: no rounded web-card chrome. -->
  <path fill="#241C13" d="M4 0h184v2h2v2h2v32h-2v2h-2v2H4v-2H2v-2H0V4h2V2h2z"/>
  <path fill="#9D7D48" d="M4 2h184v2h2v32h-2v2H4v-2H2V4h2z"/>
  <path fill="#D0AF6B" d="M6 3h180v2H6zM3 6h2v28H3z"/>
