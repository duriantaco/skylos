  - id: VH127
    languages: [python]
    severity: WARNING
    message: Request data supplies a MongoDB query filter. Validate the filter schema.
    metadata:
      vulnerability_class: nosql_injection
      cwe_ids: [CWE-943]
    mode: taint
    pattern-sources:
      - pattern-either:
          - pattern: flask.request.get_json(...)
          - pattern: flask.request.json
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: pymongo.MongoClient(...)[...][...].find($FILTER, ...)
              - pattern: pymongo.MongoClient(...)[...][...].find_one($FILTER, ...)
              - pattern: flask_pymongo.PyMongo(...).db.$COLLECTION.find($FILTER, ...)
              - pattern: flask_pymongo.PyMongo(...).db.$COLLECTION.find_one($FILTER, ...)
          - pattern-not: $DB.$METHOD({...}, ...)
          - focus-metavariable: $FILTER
      - patterns:
          - pattern-inside: |
              $CLIENT = pymongo.MongoClient(...)
              ...
          - pattern-either:
              - pattern: $CLIENT[...][...].find($FILTER, ...)
              - pattern: $CLIENT[...][...].find_one($FILTER, ...)
          - pattern-not: $DB.$METHOD({...}, ...)
          - focus-metavariable: $FILTER

