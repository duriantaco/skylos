# Optional VulnHunter static checks. See docs/vulnhunter-rules.md.
rules:
  - id: VHOG100
    languages: [python]
    severity: ERROR
    message: Runtime data is evaluated as Python code.
    metadata:
      name: python-dynamic-eval
      vulnerability_class: code_injection
      cwe_ids: [CWE-95]
      confidence: high
      severity: critical
      remediation: Parse a data format with ast.literal_eval or an explicit schema instead of eval.
    patterns:
      - pattern: eval($EXPR)
      - pattern-not: eval("...")
      - pattern-not: eval('...')

  - id: VHOG101
    languages: [python]
    severity: ERROR
    message: Request, environment, or argv data reaches a process argument vector.
    metadata:
      name: python-subprocess-argument-taint
      vulnerability_class: argument_injection
      cwe_ids: [CWE-88, CWE-78]
      confidence: medium
      severity: high
      remediation: Validate option-like values, use an allowlist, and insert -- before positional data when supported.
    mode: taint
    pattern-sources:
      - pattern-either:
          - pattern: request.args.get(...)
          - pattern: request.form.get(...)
          - pattern: request.headers.get(...)
          - pattern: request.query_params.get(...)
          - pattern: sys.argv[$INDEX]
          - pattern: input(...)
          - pattern: os.environ.get(...)
          - pattern: os.getenv(...)
    pattern-sinks:
      - pattern-either:
          - pattern: subprocess.run(...)
          - pattern: subprocess.call(...)
          - pattern: subprocess.check_call(...)
          - pattern: subprocess.check_output(...)
          - pattern: subprocess.Popen(...)
          - pattern: asyncio.create_subprocess_exec(...)

  - id: VHOG102
    languages: [python]
    severity: ERROR
    message: An exception path silently continues after a security-sensitive failure.
    metadata:
      name: python-security-fail-open
      vulnerability_class: fail_open
      cwe_ids: [CWE-754, CWE-703]
      confidence: low
      severity: high
      remediation: Fail closed for authentication, authorization, signature, and validation errors.
    patterns:
      - pattern: |
          try:
            ...
          except $EXCEPTION:
            $HANDLER
      - metavariable-pattern:
          metavariable: $HANDLER
          pattern: pass
      - pattern-inside: |
          def $FUNCTION(...):
            ...
      - metavariable-regex:
          metavariable: $FUNCTION
          regex: (?i).*(auth|authori[sz]|verify|valid|signature|token|permission|secure|check).*
      - focus-metavariable: $HANDLER

  - id: VHOG103
    languages: [python]
    severity: ERROR
    message: A route explicitly disables or bypasses its authentication dependency.
    metadata:
      name: python-route-auth-disabled
      vulnerability_class: missing_authentication
      cwe_ids: [CWE-306]
      confidence: high
      severity: high
      evidence_kind: invariant_violation
      remediation: Require the normal authentication dependency on every privileged route.
    pattern-either:
      - pattern: $APP.$METHOD(..., dependencies=[])
      - pattern: $APP.$METHOD(..., auth=None)
      - pattern: $APP.$METHOD(..., authentication=None)
      - pattern: $APP.$METHOD(..., permission_classes=[])

  - id: VHOG110
    languages: [generic]
    severity: ERROR
    message: A template marks a value safe without first applying an HTML sanitizer.
    metadata:
      name: template-unsanitized-safe-filter
      vulnerability_class: cross_site_scripting
      cwe_ids: [CWE-79]
      confidence: high
      severity: high
      remediation: Sanitize untrusted rich text before applying the template safe marker.
    paths:
      include: ["*.html", "*.htm", "*.jinja", "*.jinja2"]
    patterns:
      - pattern-regex: '\{\{[^}\n]+\|\s*safe\s*\}\}'
      - pattern-not-regex: '\|\s*(sanitize|bleach|escape|clean)(_html)?\b[^}\n]*\|\s*safe'
      - pattern-not-regex: '\{\{\s*xsrf_form_html\s*\(\s*\)\s*\|\s*safe\s*\}\}'

  - id: VHOG111
    languages: [python]
    severity: ERROR
    message: A dynamic value is inserted directly into an HTML fragment.
    metadata:
      name: python-html-fragment-interpolation
      vulnerability_class: cross_site_scripting
      cwe_ids: [CWE-79]
      confidence: medium
      severity: high
      evidence_kind: invariant_violation
      remediation: HTML-escape the value or render it through an auto-escaping template.
    patterns:
      - pattern-either:
          - patterns:
              - pattern: $HTML += $FORMAT % $VALUE
              - pattern-not: $HTML += $FORMAT % html.escape(...)
          - patterns:
              - pattern: $STREAM.write($FORMAT % $VALUE)
              - pattern-not: $STREAM.write($FORMAT % html.escape(...))
      - metavariable-regex:
          metavariable: $FORMAT
          regex: (?is).*<[^>]+>.*
      - metavariable-regex:
          metavariable: $VALUE
          regex: (?i).*(body|comment|content|description|message|text).*

  - id: VHOG112
    languages: [python]
    severity: ERROR
    message: A WebSocket handshake is accepted without checking the Origin header.
    metadata:
      name: python-websocket-origin-unvalidated
      vulnerability_class: origin_validation
      cwe_ids: [CWE-346, CWE-1385]
      confidence: medium
      severity: medium
      evidence_kind: invariant_violation
      remediation: Compare the Origin header with an allowlist before accepting the handshake.
    patterns:
      - pattern: await $WEBSOCKET.accept(...)
      - metavariable-regex:
          metavariable: $WEBSOCKET
          regex: (?i).*(websocket|web_socket|ws).*
      - pattern-not-inside: |
          async def $HANDLER(...):
            ...
            <... "=~/(?i)^origin$/" ...>
            ...
      - pattern-not-inside: |
          @$DECORATOR
          async def $HANDLER(...):
            ...
            <... "=~/(?i)^origin$/" ...>
            ...
      - pattern-not-inside: |
          @$DECORATOR(...)
          async def $HANDLER(...):
            ...
            <... "=~/(?i)^origin$/" ...>
            ...

  - id: VHOG113
    languages: [python]
    severity: ERROR
    message: Credentials, tokens or session state are written with process-default filesystem permissions.
    metadata:
      name: python-sensitive-dump-permissions
      vulnerability_class: insecure_permissions
      cwe_ids: [CWE-732]
      confidence: medium
      severity: medium
      remediation: Create the file atomically with mode 0600 (for example os.open with 0o600) and its directory with mode 0700.
    patterns:
      - pattern-either:
          - patterns:
              - pattern-either:
                  - pattern: $PATH.write_text($DATA, ...)
                  - pattern: $PATH.write_bytes($DATA, ...)
              - metavariable-regex:
                  metavariable: $PATH
                  regex: (?i).*(token|secret|credential|session|password|passwd|cookie|private_?key|api_?key|auth).*
          - patterns:
              - pattern-either:
                  - pattern: $PATH.write_text($DATA, ...)
                  - pattern: $PATH.write_bytes($DATA, ...)
              - metavariable-regex:
                  metavariable: $DATA
                  regex: (?i).*(token|secret|credential|session|password|passwd|cookie|private_?key|api_?key|auth).*
          - patterns:
              - pattern-either:
                  - pattern: $PATH.write_text($DATA, ...)
                  - pattern: $PATH.write_bytes($DATA, ...)
              - pattern-inside: |
                  def $FUNCTION(...):
                    ...
                    <... "=~/(?i).*(token|secret|credential|session|password|passwd|cookie|private_?key|api_?key|auth).*/" ...>
                    ...
      - pattern-not-inside: |
          def $FUNCTION(...):
            ...
            <... $X.chmod(...) ...>
            ...
      - pattern-not-inside: |
          def $FUNCTION(...):
            ...
            <... os.umask(...) ...>
            ...

  - id: VHOG114
    languages: [python]
    severity: ERROR
    message: An undersized key, secret or password only triggers a warning instead of being rejected.
    metadata:
      name: python-weak-key-warning-only
      vulnerability_class: signature_verification
      cwe_ids: [CWE-326, CWE-287]
      confidence: medium
      severity: medium
      evidence_kind: invariant_violation
      remediation: Reject empty and undersized key material instead of warning and continuing.
    patterns:
      - pattern-either:
          - pattern: warnings.warn(...)
          - pattern: $LOG.warning(...)
          - pattern: $LOG.warn(...)
      - pattern-inside: |
          if len($KEY) < $MINIMUM:
            ...
      - metavariable-regex:
          metavariable: $KEY
          regex: (?i).*(key|secret|password|passphrase|token|salt).*
      - pattern-not-inside: |
          if len($KEY) < $MINIMUM:
            ...
            raise $ERROR(...)

  - id: VHOG115
    languages: [python]
    severity: ERROR
    message: Per-key data is appended to an unbounded in-memory queue.
    metadata:
      name: python-unbounded-keyed-accumulation
      vulnerability_class: denial_of_service
      cwe_ids: [CWE-400, CWE-770]
      confidence: medium
      severity: high
      evidence_kind: invariant_violation
      remediation: Bound both the number of keys and the number of queued items per key.
    patterns:
      - pattern: $QUEUE.append($ITEM)
      - pattern-inside: |
          $QUEUE = $MAP.setdefault($KEY, [])
          ...
          $QUEUE.append($ITEM)
      - pattern-not-inside: |
          def $FUNCTION(...):
            ...
            if len($QUEUE) >= $LIMIT:
              ...
            ...
            $QUEUE.append($ITEM)

  - id: VHOG117
    languages: [generic]
    severity: ERROR
    message: User-authored rich content is marked safe without an HTML sanitizer.
    metadata:
      name: template-rich-content-safe-filter
      vulnerability_class: cross_site_scripting
      cwe_ids: [CWE-79]
      confidence: high
      severity: high
      evidence_kind: invariant_violation
      remediation: Sanitize rich content with an HTML allowlist before disabling template auto-escaping.
    paths:
      include: ["*.html", "*.htm", "*.jinja", "*.jinja2"]
    patterns:
      - pattern-regex: |-
          \{\{[^}\n]*(?:abstract|body|content|description|html|markdown|text)[^}\n]*\|\s*safe\s*\}\}
      - pattern-not-regex: '\{\{\s*xsrf_form_html\s*\(\s*\)\s*\|\s*safe\s*\}\}'
      - pattern-not-regex: |-
          \|\s*(?:bleach|clean|escape|sanitize)(?:_html)?\b[^}\n]*\|\s*safe

  - id: VHOG122
    languages: [python]
    severity: ERROR
    message: A host-bound development server starts without a per-request Host allowlist.
    metadata:
      name: python-server-host-validation-missing
      vulnerability_class: authentication_bypass
      cwe_ids: [CWE-346, CWE-287]
      confidence: high
      severity: high
      evidence_kind: invariant_violation
      remediation: Reject requests whose Host is not an exact allowlisted host-and-port pair before serving the application.
    patterns:
      - pattern: |
          def $FUNCTION(..., $HOST: $TYPE, ...):
            ...
            $APP.run(..., host=$HOST, ...)
      - pattern-not: |
          def $FUNCTION(..., $HOST: $TYPE, ...):
            ...
            @$APP.before_request
            def $CHECK(...):
              ...
            ...
            $APP.run(..., host=$HOST, ...)
      - pattern-not: |
          def $FUNCTION(..., $HOST: $TYPE, ...):
            ...
            @$APP.before_request
            def $CHECK(...) -> $RETURN:
              ...
            ...
            $APP.run(..., host=$HOST, ...)
      - pattern-not-regex: |-
          (?s)@[A-Za-z0-9_.$]+\.before_request\b.*?\.run\s*\(

  - id: VHOG124
    languages: [python]
    severity: ERROR
    message: An IP-based destination policy ignores IPv4-mapped and other IPv6 transition forms of internal addresses.
    metadata:
      name: python-incomplete-ipv6-transition-normalization
      vulnerability_class: server_side_request_forgery
      cwe_ids: [CWE-918, CWE-178]
      confidence: medium
      severity: medium
      evidence_kind: invariant_violation
      remediation: Unwrap ipv4_mapped, sixtofour and teredo addresses before applying the private/loopback policy.
    patterns:
      - pattern-either:
          - pattern: $ADDRESS.is_private
          - pattern: $ADDRESS.is_loopback
          - pattern: $ADDRESS.is_link_local
          - pattern: $ADDRESS.is_global
      - pattern-inside: |
          def $FUNCTION(...):
            ...
            $ADDRESS = ipaddress.ip_address(...)
            ...
      - pattern-not-inside: |
          def $FUNCTION(...):
            ...
            <... $X.ipv4_mapped ...>
            ...

  - id: VHOG126
    languages: [generic]
    severity: ERROR
    message: A dynamic value is interpolated inside a quoted JavaScript string literal in generated source.
    metadata:
      name: generated-javascript-quoted-interpolation
      vulnerability_class: cross_site_scripting
      cwe_ids: [CWE-79, CWE-94]
      confidence: high
      severity: high
      evidence_kind: invariant_violation
      remediation: Serialize the value as a JSON/JavaScript literal instead of placing it between quotes.
    paths:
      include: ["*.py", "*.html", "*.jinja", "*.jinja2"]
    pattern-regex: |-
      const\s+[A-Za-z_$][\w$]*\s*=\s*['"]\{[^}\n]+\}['"]\s*;

  - id: VHOG127
    languages: [javascript, typescript]
    severity: INFO
    message: A computed object key is written; review the key's provenance and later reads.
    metadata:
      name: javascript-computed-object-key-write
      vulnerability_class: prototype_pollution
      cwe_ids: [CWE-1321]
      confidence: low
      severity: low
      evidence_kind: context
      remediation: Use a null-prototype dictionary or Map for attacker-selected keys, and avoid inherited lookups.
    patterns:
      - pattern: $OBJECT[$KEY] = $VALUE
      - pattern-not: $OBJECT["..."] = $VALUE
      - pattern-not: $OBJECT['...'] = $VALUE

  - id: VHOG128
    languages: [javascript, typescript]
    severity: ERROR
    message: A dynamic path is passed to a deep object setter and may mutate its prototype chain.
    metadata:
      name: javascript-dynamic-deep-object-write
      vulnerability_class: prototype_pollution
      cwe_ids: [CWE-1321]
      confidence: medium
      severity: high
      evidence_kind: invariant_violation
      remediation: Validate every path segment before constructing or invoking a deep object setter.
    patterns:
      - pattern-either:
          - pattern: |
              const $PATH = new $CLASS($KEY);
              ...
              $PATH.set($OBJECT, $VALUE);
          - pattern: |
              let $PATH = new $CLASS($KEY);
              ...
              $PATH.set($OBJECT, $VALUE);
          - pattern: |
              var $PATH = new $CLASS($KEY);
              ...
              $PATH.set($OBJECT, $VALUE);
      - metavariable-regex:
          metavariable: $KEY
          regex: (?i).*(?:key|path|prop|field|name|segment).*
      - metavariable-regex:
          metavariable: $CLASS
          regex: (?i).*(?:deep|json|object|path|property).*

  - id: VHOG129
    languages: [javascript, typescript]
    severity: ERROR
    message: HTTP request data flows into a process execution command.
    metadata:
      name: javascript-request-command-injection
      vulnerability_class: command_injection
      cwe_ids: [CWE-78]
      confidence: high
      severity: critical
      evidence_kind: source_to_sink
      remediation: Map untrusted input to fixed executable and argument choices without invoking a shell.
    mode: taint
    pattern-sources: &javascript_request_sources
      - patterns:
          - pattern-either:
              - pattern-inside: function $HANDLER(..., $REQ, $RES, ...) { ... }
              - pattern-inside: function (..., $REQ, $RES, ...) { ... }
              - pattern-inside: (..., $REQ, $RES, ...) => { ... }
          - pattern-either:
              - pattern: $REQ.query
              - pattern: $REQ.body
              - pattern: $REQ.params
              - pattern: $REQ.cookies
              - pattern: $REQ.headers
          - metavariable-regex:
              metavariable: $REQ
              regex: (?i)^(?:req|request|ctx|context)$
          - metavariable-regex:
              metavariable: $RES
              regex: (?i)^(?:res|response)$
      - patterns:
          - pattern-inside: export function $HANDLER(..., $INPUT, ...) { ... }
          - focus-metavariable: $INPUT
      - patterns:
          - pattern-inside: module.exports.$HANDLER = function (..., $INPUT, ...) { ... }
          - focus-metavariable: $INPUT
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: exec($COMMAND, ...)
              - pattern: execSync($COMMAND, ...)
              - pattern: $PROCESS.exec($COMMAND, ...)
              - pattern: $PROCESS.execSync($COMMAND, ...)
              - pattern: "$PROCESS.spawn($COMMAND, { ..., shell: true, ... })"
              - pattern: "$PROCESS.spawnSync($COMMAND, { ..., shell: true, ... })"
          - focus-metavariable: $COMMAND

  - id: VHOG130
    languages: [javascript, typescript]
    severity: ERROR
    message: HTTP request data flows into dynamic JavaScript evaluation.
    metadata:
      name: javascript-request-code-injection
      vulnerability_class: code_injection
      cwe_ids: [CWE-94, CWE-95]
      confidence: high
      severity: critical
      evidence_kind: source_to_sink
      remediation: Replace dynamic source evaluation with a fixed operation allowlist and data parser.
    mode: taint
    pattern-sources:
      - patterns:
          - pattern-either:
              - pattern-inside: function $HANDLER(..., $REQ, $RES, ...) { ... }
              - pattern-inside: function (..., $REQ, $RES, ...) { ... }
              - pattern-inside: (..., $REQ, $RES, ...) => { ... }
          - pattern-either:
              - pattern: $REQ.query
              - pattern: $REQ.body
              - pattern: $REQ.params
              - pattern: $REQ.cookies
              - pattern: $REQ.headers
          - metavariable-regex:
              metavariable: $REQ
              regex: (?i)^(?:req|request|ctx|context)$
          - metavariable-regex:
              metavariable: $RES
              regex: (?i)^(?:res|response)$
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: eval($SOURCE)
              - pattern: new Function($SOURCE)
              - pattern: new Function(..., $SOURCE)
              - pattern: $VM.runInNewContext($SOURCE, ...)
              - pattern: $VM.runInContext($SOURCE, ...)
          - focus-metavariable: $SOURCE

  - id: VHOG131
    languages: [javascript, typescript]
    severity: ERROR
    message: HTTP request data flows into the SQL statement argument.
    metadata:
      name: javascript-request-sql-injection
      vulnerability_class: sql_injection
      cwe_ids: [CWE-89]
      confidence: high
      severity: high
      evidence_kind: source_to_sink
      remediation: Keep the statement constant and pass untrusted values through parameter placeholders.
    mode: taint
    pattern-sources:
      - patterns:
          - pattern-either:
              - pattern-inside: function $HANDLER(..., $REQ, $RES, ...) { ... }
              - pattern-inside: function (..., $REQ, $RES, ...) { ... }
              - pattern-inside: (..., $REQ, $RES, ...) => { ... }
          - pattern-either:
              - pattern: $REQ.query
              - pattern: $REQ.body
              - pattern: $REQ.params
              - pattern: $REQ.cookies
              - pattern: $REQ.headers
          - metavariable-regex:
              metavariable: $REQ
              regex: (?i)^(?:req|request|ctx|context)$
          - metavariable-regex:
              metavariable: $RES
              regex: (?i)^(?:res|response)$
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: $DB.query($QUERY, ...)
              - pattern: $DB.execute($QUERY, ...)
              - pattern: $DB.raw($QUERY, ...)
          - focus-metavariable: $QUERY

  - id: VHOG132
    languages: [javascript, typescript]
    severity: ERROR
    message: HTTP request data flows into an outbound request destination.
    metadata:
      name: javascript-request-ssrf
      vulnerability_class: server_side_request_forgery
      cwe_ids: [CWE-918]
      confidence: high
      severity: high
      evidence_kind: source_to_sink
      remediation: Parse, resolve, and allowlist every destination and redirect hop immediately before connecting.
    mode: taint
    pattern-sources:
      - patterns:
          - pattern-either:
              - pattern-inside: function $HANDLER(..., $REQ, $RES, ...) { ... }
              - pattern-inside: function (..., $REQ, $RES, ...) { ... }
              - pattern-inside: (..., $REQ, $RES, ...) => { ... }
          - pattern-either:
              - pattern: $REQ.query
              - pattern: $REQ.body
              - pattern: $REQ.params
              - pattern: $REQ.cookies
              - pattern: $REQ.headers
          - metavariable-regex:
              metavariable: $REQ
              regex: (?i)^(?:req|request|ctx|context)$
          - metavariable-regex:
              metavariable: $RES
              regex: (?i)^(?:res|response)$
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: fetch($URL, ...)
              - pattern: $CLIENT.get($URL, ...)
              - pattern: $CLIENT.post($URL, ...)
              - pattern: $CLIENT.request($URL, ...)
          - focus-metavariable: $URL

  - id: VHOG133
    languages: [go]
    severity: ERROR
    message: HTTP request data flows into process execution.
    metadata:
      name: go-request-command-injection
      vulnerability_class: command_injection
      cwe_ids: [CWE-78]
      confidence: high
      severity: critical
      evidence_kind: source_to_sink
      remediation: Select a fixed executable and fixed option structure, then validate each data argument.
    mode: taint
    pattern-sources: &go_request_sources
      - pattern-either:
          - pattern: $REQ.URL.Query().Get(...)
          - pattern: $REQ.FormValue(...)
          - pattern: $REQ.PostFormValue(...)
          - pattern: $REQ.PathValue(...)
          - pattern: $CTX.Query(...)
          - pattern: $CTX.Param(...)
          - pattern: $CTX.FormValue(...)
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: exec.Command($COMMAND, ...)
              - pattern: exec.CommandContext(..., $COMMAND, ...)
              - pattern: exec.Command("sh", "-c", $COMMAND)
              - pattern: exec.Command("bash", "-c", $COMMAND)
          - focus-metavariable: $COMMAND

  - id: VHOG134
    languages: [go]
    severity: ERROR
    message: HTTP request data flows into the SQL statement argument.
    metadata:
      name: go-request-sql-injection
      vulnerability_class: sql_injection
      cwe_ids: [CWE-89]
      confidence: high
      severity: high
      evidence_kind: source_to_sink
      remediation: Keep the statement constant and bind request values as query parameters.
    mode: taint
    pattern-sources:
      - pattern-either:
          - pattern: $REQ.URL.Query().Get(...)
          - pattern: $REQ.FormValue(...)
          - pattern: $REQ.PostFormValue(...)
          - pattern: $REQ.PathValue(...)
          - pattern: $CTX.Query(...)
          - pattern: $CTX.Param(...)
          - pattern: $CTX.FormValue(...)
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: $DB.Query($QUERY, ...)
              - pattern: $DB.QueryContext(..., $QUERY, ...)
              - pattern: $DB.QueryRow($QUERY, ...)
              - pattern: $DB.Exec($QUERY, ...)
              - pattern: $DB.ExecContext(..., $QUERY, ...)
              - pattern: $DB.Raw($QUERY, ...)
          - pattern-not: $DB.Query("...", ...)
          - pattern-not: $DB.QueryContext(..., "...", ...)
          - pattern-not: $DB.QueryRow("...", ...)
          - pattern-not: $DB.Exec("...", ...)
          - pattern-not: $DB.ExecContext(..., "...", ...)
          - pattern-not: $DB.Raw("...", ...)
          - focus-metavariable: $QUERY

  - id: VHOG135
    languages: [go]
    severity: ERROR
    message: HTTP request data flows into an outbound request destination.
    metadata:
      name: go-request-ssrf
      vulnerability_class: server_side_request_forgery
      cwe_ids: [CWE-918]
      confidence: high
      severity: high
      evidence_kind: source_to_sink
      remediation: Resolve and allowlist the destination IP for every redirect immediately before connecting.
    mode: taint
    pattern-sources:
      - pattern-either:
          - pattern: $REQ.URL.Query().Get(...)
          - pattern: $REQ.FormValue(...)
          - pattern: $REQ.PostFormValue(...)
          - pattern: $REQ.PathValue(...)
          - pattern: $CTX.Query(...)
          - pattern: $CTX.Param(...)
          - pattern: $CTX.FormValue(...)
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: http.Get($URL)
              - pattern: http.Post($URL, ...)
              - pattern: http.NewRequest(..., $URL, ...)
              - pattern: http.NewRequestWithContext(..., ..., $URL, ...)
          - focus-metavariable: $URL

  - id: VHOG137
    languages: [java]
    severity: ERROR
    message: HTTP request data flows into Java process execution.
    metadata:
      name: java-request-command-injection
      vulnerability_class: command_injection
      cwe_ids: [CWE-78]
      confidence: high
      severity: critical
      evidence_kind: source_to_sink
      remediation: Select a fixed executable and argument structure; never pass request data to a shell.
    mode: taint
