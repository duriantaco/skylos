    severity: ERROR
    message: A secret, key or password read from the environment falls back to a hardcoded placeholder.
    metadata:
      name: python-secret-insecure-default
      vulnerability_class: fail_open
      cwe_ids: [CWE-1188, CWE-798]
      confidence: medium
      severity: medium
      evidence_kind: invariant_violation
      remediation: Require the secret at startup and refuse to run when it is missing, empty or a known placeholder.
    patterns:
      - pattern-either:
          - pattern: os.getenv($NAME, $DEFAULT)
          - pattern: os.getenv($NAME, default=$DEFAULT)
          - pattern: os.environ.get($NAME, $DEFAULT)
          - pattern: os.environ.get($NAME, default=$DEFAULT)
      - metavariable-regex:
          metavariable: $NAME
          regex: ^["'](?![A-Z0-9_]*_(HEADER|NAME|FILE|PATH|URL|PREFIX|LENGTH|TTL|SECONDS|MINUTES|HOURS|DAYS|ENABLED|ALGORITHM)["'])[A-Z0-9_]*(SECRET|PASSWORD|PASSWD|PASSPHRASE|TOKEN|API_?KEY|PRIVATE_?KEY|SIGNING_?KEY|PEPPER|SALT)[A-Z0-9_]*["']$
      - metavariable-regex:
          metavariable: $DEFAULT
          regex: ^b?(["']).+\1$

