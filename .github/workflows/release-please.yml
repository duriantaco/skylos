name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    timeout-minutes: 75
    concurrency:
      group: release-please-main
      cancel-in-progress: false
    permissions:
      contents: write
      checks: read
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Require current main commit
        id: main_commit
        env:
          GH_TOKEN: ${{ github.token }}
          TESTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          main_sha="$(gh api "/repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          if [[ "$TESTED_SHA" != "$main_sha" ]]; then
            echo "Skipping stale CI result: tested $TESTED_SHA, current main $main_sha"
            exit 0
          fi
          echo "current=true" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        if: steps.main_commit.outputs.current == 'true'
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Require successful release checks
        id: checks
        if: steps.main_commit.outputs.current == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TESTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # The aggregate test check appears only after the long matrix ends.
          # Wait up to an hour before Release Please creates a tag or PR.
          for attempt in {1..180}; do
            gh api \
              -H "Accept: application/vnd.github+json" \
              "/repos/${GITHUB_REPOSITORY}/commits/${TESTED_SHA}/check-runs?per_page=100&filter=all" \
              > "$RUNNER_TEMP/skylos-release-checks.json"

            status=0
            python tools/release/check_release_checks.py "$RUNNER_TEMP/skylos-release-checks.json" || status=$?
            if [ "$status" -eq 0 ]; then
              main_sha="$(gh api "/repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
              if [[ "$TESTED_SHA" != "$main_sha" ]]; then
                echo "Skipping stale CI result: tested $TESTED_SHA, current main $main_sha"
                exit 0
              fi
              echo "ready=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [ "$status" -eq 1 ]; then
              exit 0
            fi
            if [ "$status" -ne 2 ]; then
              exit "$status"
            fi
            if [ "$attempt" -eq 180 ]; then
              echo "Required release checks did not complete within one hour" >&2
              exit 2
            fi
            sleep 20
          done

      - uses: googleapis/release-please-action@16a9c90856f42705d54a6fda1823352bdc62cf38 # v4.4.0 (pin SHA to avoid supply chain attacks))
        id: release
        if: steps.checks.outputs.ready == 'true'
        with:
          # Prefer a dedicated token/App so release PRs can satisfy required PR checks.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN != '' && secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          target-branch: main
          config-file: tools/release/release-please-config.json
          manifest-file: tools/release/.release-please-manifest.json

  publish-release:
    name: Publish release artifacts
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    uses: ./.github/workflows/publish.yml
    permissions:
      contents: read
      checks: read
      packages: write
    with:
      ref: ${{ needs.release-please.outputs.tag_name }}
    secrets:
      PYPI_TOKEN: ${{ secrets.PYPI_TOKEN }}
