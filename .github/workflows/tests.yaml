name: Tests + Coverage

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows_verify:
    name: windows-verify-working-snapshot
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@e4db8464a088ece1b920f60402e813ea4de65b8f # v4

      - name: Install Python and focused test dependencies
        shell: bash
        run: |
          uv python install 3.11
          uv venv --python 3.11
          uv pip install --python .venv/Scripts/python.exe -e . pytest

      - name: Verify Windows working-source snapshots
        shell: bash
        run: |
          .venv/Scripts/python.exe -m pytest -q \
            test/test_refactor_verify.py \
            test/test_behavior_baselines.py \
            -k 'windows_working_snapshot or windows_snapshot or windows_native_child_open or windows_case_sensitivity or unchanged_symbol_records_snapshot_identity or working_snapshot_preserves_encoded_bytes_and_line_endings or snapshot_identity_hashes_exact_encoded_bytes'

  test_matrix:
    name: test-matrix (${{ matrix.install_target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        install_target:
          - "."
          - ".[llm]"

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.22"

      - uses: astral-sh/setup-uv@e4db8464a088ece1b920f60402e813ea4de65b8f # v4

      - name: Check lockfile
        run: uv lock --check

      - name: Build repo Go engine
        run: |
          mkdir -p /tmp/skylos-go-build /tmp/skylos-go-gopath
          cd skylos/engines/go
          GOCACHE=/tmp/skylos-go-build GOPATH=/tmp/skylos-go-gopath go build -o skylos-go ./cmd/skylos-go

      - name: Install ripgrep for grep-verify backend tests
        run: sudo apt-get install -y ripgrep

      - name: Create venv + install deps
        run: |
          uv venv
          uv pip install --python .venv/bin/python -e "${{ matrix.install_target }}"
          uv pip install --python .venv/bin/python pytest pytest-cov

      - name: Run tests with coverage
        run: |
          .venv/bin/python -m pytest -q --cov=skylos --cov-report=term-missing --cov-report=xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@75cd11691c0faa626561e295848008c8a7dddffe
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          disable_search: true
          fail_ci_if_error: false
          flags: ${{ matrix.install_target == '.[llm]' && 'llm-extra' || 'default-install' }}

  docker_smoke:
    name: docker-smoke (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Build image
        run: docker build --build-arg "PYTHON_VERSION=${{ matrix.python-version }}" -t skylos:test .

      - name: Check CLI version
        run: docker run --rm skylos:test --version

      - name: Check Go engine
        run: |
          docker run --rm skylos:test doctor --format json |
            python -c 'import json, sys; assert json.load(sys.stdin)["checks"]["go_engine"]["status"] == "available"'

      - name: Check Python runtime
        shell: bash
        run: |
          actual="$(docker run --rm --entrypoint python skylos:test -c 'import sys; print(f"{sys.version_info.major}.{sys.version_info.minor}")')"
          test "$actual" = "${{ matrix.python-version }}"

      - name: Run fixture scan
        run: |
          docker run --rm \
            -v "$PWD/benchmarks/quality/fixtures/argument_overload:/work" \
            -w /work \
            skylos:test \
            . --json --no-provenance > /tmp/skylos-docker-smoke.json
          grep -q '"unused_functions"' /tmp/skylos-docker-smoke.json

      - name: Scan current Python syntax
        if: matrix.python-version == '3.14'
        run: |
          mkdir -p /tmp/skylos-python-syntax
          printf 'type CacheEntry[T = str] = dict[str, T]\n\ndef stale_helper():\n    return CacheEntry()\n' > /tmp/skylos-python-syntax/example.py
          docker run --rm \
            -v "/tmp/skylos-python-syntax:/work" \
            -w /work \
            skylos:test \
            . --json --no-provenance > /tmp/skylos-python-syntax.json
          grep -q '"stale_helper"' /tmp/skylos-python-syntax.json

  image_action_smoke:
    name: action-image-smoke
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Install checksum-verified Trivy
        shell: bash
        run: |
          archive="$RUNNER_TEMP/trivy_0.74.0_Linux-64bit.tar.gz"
          install_dir="$RUNNER_TEMP/skylos-trivy-bin"
          mkdir -p "$install_dir"
          curl --fail --location --silent --show-error \
            --output "$archive" \
            https://github.com/aquasecurity/trivy/releases/download/v0.74.0/trivy_0.74.0_Linux-64bit.tar.gz
          printf '%s  %s\n' \
            '2ae6fe3ee734b7fdf11335663e18c75ea12dccc76062f09f164a3b0f8be4371a' \
            "$archive" | sha256sum --check --status
          tar -xzf "$archive" -C "$install_dir" trivy
          sudo install -m 0755 "$install_dir/trivy" /usr/local/bin/trivy

      - name: Scan pinned public image with local action
        id: image_scan
        uses: ./
        with:
          image: docker.io/library/alpine@sha256:1f3591b8a02ea153f41c5bba878ad477f63ab3d19349762cb77504db02a23e15
          image-platform: linux/amd64
          mode: scan

      - name: Verify image scan receipt
        shell: bash
        env:
          REPORT: ${{ steps.image_scan.outputs.report-path }}
          FINDINGS_COUNT: ${{ steps.image_scan.outputs.findings-count }}
        run: |
          python -I - "$REPORT" "$FINDINGS_COUNT" <<'PY'
          import json
          from pathlib import Path
          import sys

          report = Path(sys.argv[1])
          assert report.is_file(), report
          data = json.loads(report.read_text(encoding="utf-8"))
          receipt = data["receipt"]
          assert receipt["execution"]["status"] == "completed", receipt
          assert receipt["import_complete"] is True, receipt
          assert receipt["identity_verified"] is True, receipt
          assert receipt["platform_verified"] is True, receipt
          assert not receipt["errors"], receipt
          assert data["gate"]["scope"] == "direct_image_scan", data["gate"]
          assert data["gate"]["status"] == "not_requested", data["gate"]
          assert len(data["container_vulnerabilities"]) == int(sys.argv[2])
          print("Verified pinned image scan:", len(data["container_vulnerabilities"]), "finding(s)")
          PY

  test:
    name: test
    runs-on: ubuntu-latest
    needs: [test_matrix, docker_smoke, windows_verify]
    if: ${{ always() }}

    steps:
      - name: Require matrix success
        run: |
          if [ "${{ needs.test_matrix.result }}" != "success" ] ||
             [ "${{ needs.docker_smoke.result }}" != "success" ] ||
             [ "${{ needs.windows_verify.result }}" != "success" ]; then
            echo "test_matrix result: ${{ needs.test_matrix.result }}"
            echo "docker_smoke result: ${{ needs.docker_smoke.result }}"
            echo "windows_verify result: ${{ needs.windows_verify.result }}"
            exit 1
          fi
