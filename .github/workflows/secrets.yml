name: Secrets Regression

on:
  pull_request:
  push:
    branches: [main, feat/secrets-pipeline-precision]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@e4db8464a088ece1b920f60402e813ea4de65b8f # v4

      - name: Install test dependencies
        run: |
          uv python install 3.12
          uv venv --python 3.12
          uv pip install -e ".[test]"

      - name: Check secrets, decoding and output protection
        run: |
          .venv/bin/python -B -m pytest -q \
            test/test_secrets.py \
            test/test_secrets_credentials.py \
            test/test_secrets_generic_context.py \
            test/test_secrets_nonpy.py \
            test/test_secrets_prose_cli.py \
            test/test_secrets_public_shapes.py \
            test/test_diff_scope_secret_configs.py \
            test/test_secrets_provider_precision.py \
            test/test_secret_decoding.py \
            test/test_secrets_output_redaction.py \
            test/test_secrets_benchmark.py \
            test/test_secrets_scope_policy.py \
            test/test_secrets_file_collection.py \
            test/test_s102.py \
            test/test_cicd_evidence.py \
            test/test_duplicate_literal_signal.py \
            test/test_feedback_cmd.py \
            test/test_hook_cmd.py \
            test/test_mcp_rules.py \
            test/test_typescript_inline_ignores.py \
            test/test_file_discovery.py \
            test/test_scan_root_exclusions.py \
            test/test_diff_scope.py \
            test/test_diff_default_exclusions.py \
            test/test_diff_scope_cli_paths.py

      - name: Check every original positive and safe secrets contract
        run: |
          .venv/bin/python -B scripts/secrets_benchmark.py \
            --source . \
            --output "$RUNNER_TEMP/skylos-secrets-head"

      - name: Check TypeScript and JavaScript source and test paths
        run: |
          .venv/bin/python -B scripts/secrets_benchmark.py \
            --manifest benchmarks/secrets/cross_language_manifest.json \
            --source . \
            --output "$RUNNER_TEMP/skylos-secrets-languages"
