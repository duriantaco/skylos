# Skylos Tokenless GitHub CI
#
# This example uses GitHub OIDC instead of a long-lived SKYLOS_TOKEN secret.
# Requirements:
#   - A Skylos Cloud project linked to this GitHub repository
#   - Save this workflow as .github/workflows/skylos.yml (Cloud pins that path)
#   - Grant id-token: write only to the default-branch upload job
#
# Pull requests receive local scan feedback without Cloud upload or OIDC.
# Default-branch pushes upload through the repository's trusted workflow.

name: Skylos Tokenless CI

"on":
  push:
  pull_request:

permissions: {}

jobs:
  pull-request:
    if: github.event_name == 'pull_request'
    name: Skylos pull request scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install Skylos
        run: python -I -m pip install skylos

      - name: Scan pull request locally
        run: skylos . --danger --quality --secrets --ai-defects --no-upload

  cloud-upload:
    if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    name: Skylos default branch upload
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install Skylos
        run: python -I -m pip install skylos

      - name: Pull Skylos Cloud policy
        run: skylos sync pull

      - name: Scan and upload
        run: skylos . --danger --quality --secrets --ai-defects --upload
        env:
          SKYLOS_COMMIT: ${{ github.sha }}
          SKYLOS_BRANCH: ${{ github.ref_name }}
