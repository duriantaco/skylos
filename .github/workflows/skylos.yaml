name: Skylos Advisory Scan

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: skylos-advisory-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    # Leave time after the scanner's own deadline for reports and cleanup.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.22"
          cache: false

      - uses: astral-sh/setup-uv@e4db8464a088ece1b920f60402e813ea4de65b8f # v4

      - name: Build repo Go engine
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p "$RUNNER_TEMP/skylos-go-engine" "$RUNNER_TEMP/skylos-go-build" "$RUNNER_TEMP/skylos-go-gopath"
          cd skylos/engines/go
          GOCACHE="$RUNNER_TEMP/skylos-go-build" GOPATH="$RUNNER_TEMP/skylos-go-gopath" \
            go build -trimpath -o "$RUNNER_TEMP/skylos-go-engine/skylos-go" ./cmd/skylos-go

      - name: Build trusted base Go engine for pull requests
        if: github.event_name == 'pull_request'
        env:
          TRUSTED_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          if [[ ! "$TRUSTED_BASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid pull request base SHA" >&2
            exit 1
          fi
          git cat-file -e "$TRUSTED_BASE_SHA^{commit}"
          TRUSTED_SOURCE_ROOT="$RUNNER_TEMP/skylos-trusted-base"
          ENGINE_DIR="$RUNNER_TEMP/skylos-go-engine"
          mkdir -p "$TRUSTED_SOURCE_ROOT" "$ENGINE_DIR" "$RUNNER_TEMP/skylos-go-build" "$RUNNER_TEMP/skylos-go-gopath"
          git archive "$TRUSTED_BASE_SHA" -- skylos/engines/go | tar -x -C "$TRUSTED_SOURCE_ROOT"
          cd "$TRUSTED_SOURCE_ROOT/skylos/engines/go"
          GOCACHE="$RUNNER_TEMP/skylos-go-build" GOPATH="$RUNNER_TEMP/skylos-go-gopath" \
            go build -trimpath -o "$ENGINE_DIR/skylos-go" ./cmd/skylos-go
          "$ENGINE_DIR/skylos-go" --version

      - name: Install trusted Skylos for pull requests
        if: github.event_name == 'pull_request'
        run: |
          uv venv --python 3.11
          # Reviewed scanner fixes and the compact PR report button, including
          # escaped report links and isolated Actions context.
          # Use this snapshot until those fixes are released on PyPI.
          # Keep this immutable and independent of the PR's code or metadata.
          uv pip install --python .venv/bin/python "skylos @ git+https://github.com/duriantaco/skylos.git@ab5fda49b111f844e0ae3c7fa2218b3730a6bb31"
          .venv/bin/skylos --version

      - name: Use repo Skylos on trusted refs
        if: github.event_name != 'pull_request'
        run: |
          uv venv --python 3.11
          uv pip install --python .venv/bin/python -e .
          .venv/bin/python -c "import skylos; print('skylos from:', skylos.__file__)"
          .venv/bin/python -c "import skylos.visitors.languages; print('languages OK')"

      - name: Resolve diff base
        id: diff
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        shell: bash
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            if [[ ! "$PR_BASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
              echo "Invalid pull request base SHA" >&2
              exit 1
            fi
            git cat-file -e "$PR_BASE_SHA^{commit}"
            echo "base=$PR_BASE_SHA" >> "$GITHUB_OUTPUT"
          elif [[ "$BEFORE_SHA" =~ ^[0-9a-f]{40}$ ]] \
            && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ] \
            && git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null \
            && git merge-base --is-ancestor "$BEFORE_SHA" HEAD; then
            echo "base=$BEFORE_SHA" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No available ancestor push base; running a full scan."
            echo "base=" >> "$GITHUB_OUTPUT"
          fi

      - name: Run Skylos
        id: scan
        timeout-minutes: 40
        env:
          REPORT: skylos_${{ github.run_number }}_${{ github.sha }}.json
          DIFF_BASE: ${{ steps.diff.outputs.base }}
          # Give the large self-scan additional verification time while
          # retaining a two-minute grep-verification limit.
          SKYLOS_GREP_BUDGET: "120"
          SKYLOS_GO_BIN: ${{ format('{0}/skylos-go-engine/skylos-go', runner.temp) }}
        shell: bash
        run: |
          echo "REPORT=$REPORT" >> "$GITHUB_OUTPUT"
          AI_DEFECTS_FLAG=""
          if .venv/bin/skylos --help | grep -q -- "--ai-defects"; then
            AI_DEFECTS_FLAG="--ai-defects"
          fi
          # The grep budget only bounds dead-code verification. Bound the
          # whole process too, and print stacks during otherwise silent scans.
          # The stacks come from a Python thread, which holds the GIL while it
          # reads them. faulthandler's watchdog reads them without the GIL and
          # crashed the scan with SIGSEGV when it caught a frame mid-update.
          # faulthandler stays enabled for real crashes.
          # -I keeps the checked-out PR package off Python's import path.
          # A Python diagnostics thread holds the GIL while dumping frames,
          # avoiding the native watchdog's race with live frame teardown.
          SKYLOS=(timeout --signal=INT --kill-after=30s 35m .venv/bin/python -I -c '
          import faulthandler, sys, threading, time, traceback
          faulthandler.enable()
          main_thread = threading.main_thread().ident
          def report_progress():
              while True:
                  time.sleep(300)
                  frame = sys._current_frames().get(main_thread)
                  if frame is not None:
                      print("Skylos is still scanning; main thread stack:", file=sys.stderr, flush=True)
                      traceback.print_stack(frame, file=sys.stderr)
                      sys.stderr.flush()
          threading.Thread(target=report_progress, daemon=True).start()
          from skylos.entry import main
          main()
          ')
          set +e
          if [ -n "$DIFF_BASE" ]; then
            "${SKYLOS[@]}" . --quality --danger --secrets $AI_DEFECTS_FLAG --diff-base "$DIFF_BASE" --diff "$DIFF_BASE" --json -o "$REPORT"
            SCAN_STATUS=$?
          else
            "${SKYLOS[@]}" . --quality --danger --secrets $AI_DEFECTS_FLAG --json -o "$REPORT"
            SCAN_STATUS=$?
          fi
          set -e
          echo "status=$SCAN_STATUS" >> "$GITHUB_OUTPUT"
          if [ "$SCAN_STATUS" -ne 0 ] && [ ! -s "$REPORT" ]; then
            echo "Skylos exited $SCAN_STATUS without producing $REPORT" >&2
            exit "$SCAN_STATUS"
          fi

      - name: Report findings (advisory)
        if: always() && steps.scan.outcome == 'success'
        env:
          REPORT: ${{ steps.scan.outputs.REPORT }}
        run: |
          .venv/bin/skylos cicd gate --input "$REPORT" --summary --advisory

      - name: Block high-risk security findings
        if: always() && steps.scan.outcome == 'success'
        env:
          REPORT: ${{ steps.scan.outputs.REPORT }}
        run: |
          python - "$REPORT" <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          severity_rank = {"LOW": 1, "MEDIUM": 2, "HIGH": 3, "CRITICAL": 4}
          report_path = sys.argv[1]
          with open(report_path, encoding="utf-8") as fh:
              report = json.load(fh)

          # These deliberately vulnerable examples are excluded by this
          # repository's scan policy. Older released scanners miss that
          # exclusion in config and diff-mode injection checks. Keep their
          # raw findings in the artifact; real secrets still block everywhere.
          fixture_root = Path.cwd() / "benchmarks/security/fixtures"
          excluded_fixture_dangers = 0
          blocking = []
          for category in ("danger", "secrets"):
              for finding in report.get(category, []) or []:
                  raw_path = finding.get("file") or finding.get("file_path")
                  if category == "danger" and raw_path:
                      candidate = Path(os.path.abspath(raw_path))
                      if candidate.is_relative_to(fixture_root):
                          excluded_fixture_dangers += 1
                          continue
                  severity = str(
                      finding.get("severity") or ("HIGH" if category == "secrets" else "")
                  ).upper()
                  if severity_rank.get(severity, 0) >= severity_rank["HIGH"]:
                      blocking.append((category, severity, finding))

          if excluded_fixture_dangers:
              print(f"Excluded {excluded_fixture_dangers} benchmark fixture danger findings from the self-scan gate; raw findings remain in the report.")

          if not blocking:
              print("No high-risk security findings in the scanned scope.")
              sys.exit(0)

          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          lines = [
              "## Blocking Skylos findings",
              "",
              "HIGH/CRITICAL security or secret findings were detected in the scanned scope.",
              "",
          ]

          for category, severity, finding in blocking[:20]:
              file_path = finding.get("file") or finding.get("file_path") or "unknown"
              line = finding.get("line") or finding.get("line_number") or 1
              rule = finding.get("rule_id") or finding.get("rule") or category
              message = finding.get("message") or "High-risk finding"
              detail = f"{severity} {rule} {file_path}:{line} - {message}"
              print(detail)
              print(f"::error file={file_path},line={line},title=Skylos {rule}::{detail}")
              lines.append(f"- `{severity}` `{rule}` {file_path}:{line} - {message}")

          if len(blocking) > 20:
              lines.append(f"- ...and {len(blocking) - 20} more finding(s)")

          if summary:
              with open(summary, "a", encoding="utf-8") as fh:
                  fh.write("\n".join(lines) + "\n")

          raise SystemExit(1)
          PY

      - name: GitHub annotations
        if: always() && steps.scan.outcome == 'success'
        env:
          REPORT: ${{ steps.scan.outputs.REPORT }}
        run: |
          .venv/bin/skylos cicd annotate --input "$REPORT"

      - name: Upload report artifact
        if: always() && steps.scan.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.scan.outputs.REPORT }}
          path: ${{ steps.scan.outputs.REPORT }}
          if-no-files-found: error

      - name: Preserve Skylos scan exit code
        if: always() && steps.scan.outputs.status != '0'
        env:
          SCAN_STATUS: ${{ steps.scan.outputs.status }}
        shell: bash
        run: |
          if [[ ! "$SCAN_STATUS" =~ ^[1-9][0-9]*$ ]]; then
            echo "Invalid Skylos exit status: $SCAN_STATUS" >&2
            exit 1
          fi
          exit "$SCAN_STATUS"

      - name: Summarize in job log
        if: always()
        run: |
          echo "Skylos report: ${{ steps.scan.outputs.REPORT }}" >> $GITHUB_STEP_SUMMARY

  summary:
    name: Skylos PR summary
    needs: scan
    # Fork PRs keep their read-only scan and artifact. Posting is restricted to
    # same-repository PRs, where GitHub can grant the comment permission.
    if: >-
      always() && !cancelled() && github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    env:
      REPORT: skylos_${{ github.run_number }}_${{ github.sha }}.json
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install trusted PR renderer
        run: |
          # Keep the installed renderer outside the PR checkout. Isolated
          # Python prevents checked-out modules from replacing it.
          python -I -m venv "$RUNNER_TEMP/skylos-review-venv"
          "$RUNNER_TEMP/skylos-review-venv/bin/python" -I -m pip install \
            "skylos @ git+https://github.com/duriantaco/skylos.git@ab5fda49b111f844e0ae3c7fa2218b3730a6bb31"

      - name: Download the saved scan report
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ env.REPORT }}
          path: ${{ runner.temp }}/skylos-review

      - name: Update the PR summary
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          SKYLOS_GATE_RESULT: ${{ needs.scan.result }}
        run: |
          if [[ ! "$PR_BASE_SHA" =~ ^[0-9a-f]{40}$ ]] || [[ ! "$PR_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "Invalid pull request identity or comparison base" >&2
            exit 1
          fi
          "$RUNNER_TEMP/skylos-review-venv/bin/python" -I -m skylos.cli cicd review . \
            --input "$RUNNER_TEMP/skylos-review/$REPORT" \
            --diff-base "$PR_BASE_SHA" \
            --pr "$PR_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --summary-only \
            --gate-result "$SKYLOS_GATE_RESULT"
